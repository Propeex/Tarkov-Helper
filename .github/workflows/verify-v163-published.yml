name: Verify Published v1.6.3

on:
  push:
    branches:
      - hotfix/v1.6.3-reset-persistence-queues

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Download published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path published -Force | Out-Null
          gh release download v1.6.3 --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip" --dir published
          if ($LASTEXITCODE -ne 0) { throw "Failed to download published ZIP." }
          gh release download v1.6.3 --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip.sha256" --dir published
          if ($LASTEXITCODE -ne 0) { throw "Failed to download published SHA-256 file." }

      - name: Verify published package
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "published/TarkovHelper_JH.zip"
          $shaPath = "published/TarkovHelper_JH.zip.sha256"
          $declaredHash = ((Get-Content $shaPath -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declaredHash -ne $actualHash) {
            throw "Published SHA-256 mismatch: declared=$declaredHash actual=$actualHash"
          }

          Expand-Archive $zipPath -DestinationPath published/extracted -Force
          $exePath = "published/extracted/TarkovHelper_JH.exe"
          $dbPath = "published/extracted/Assets/tarkov_data.db"
          foreach ($requiredFile in @($exePath, $dbPath)) {
            if (-not (Test-Path $requiredFile)) { throw "Missing required file: $requiredFile" }
          }

          $version = (Get-Item $exePath).VersionInfo.FileVersion
          if ($version -ne "1.6.3.0") { throw "Unexpected executable version: $version" }

          @'
          import pathlib
          import sqlite3
          import sys
          import zipfile
          from PIL import Image

          zip_path, db_path = sys.argv[1], sys.argv[2]
          forbidden = {
              'user_data.db', 'quest_progress.json', 'quest_progress_v2.json',
              'objective_progress.json', 'hideout_progress.json', 'item_inventory.json',
              'settings.json', 'app_settings.json'
          }
          invalid_filename_chars = set('<>:"/\\|?*')

          def sanitize_file_name(value):
              return ''.join(
                  '_' if char in invalid_filename_chars or ord(char) < 32 else char
                  for char in value
              )

          with zipfile.ZipFile(zip_path) as archive:
              names = [name.replace('\\', '/') for name in archive.namelist()]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate ZIP entries')
              if any(name.startswith('/') or '..' in name.split('/') for name in names):
                  raise SystemExit('unsafe ZIP path')
              if any(
                  pathlib.PurePosixPath(name).name.lower() in forbidden or name.lower().endswith('.pdb')
                  for name in names
              ):
                  raise SystemExit('user data or debug file included')
              icon_names = {
                  pathlib.PurePosixPath(name).stem.lower()
                  for name in names
                  if name.lower().startswith('assets/icons/') and name.lower().endswith('.png')
              }
              if len(icon_names) < 100:
                  raise SystemExit(f'too few packaged item icons: {len(icon_names)}')

          connection = sqlite3.connect(db_path)
          if connection.execute('pragma integrity_check').fetchone()[0] != 'ok':
              raise SystemExit('SQLite integrity_check failed')
          if connection.execute('pragma foreign_key_check').fetchall():
              raise SystemExit('SQLite foreign-key violation')

          required_icon_ids = {
              row[0]
              for row in connection.execute('''
                  select distinct i.Id
                  from Items i
                  where i.IconUrl is not null
                    and trim(i.IconUrl) != ''
                    and (
                      exists (
                        select 1 from QuestRequiredItems q
                        where q.ItemId = i.Id
                          and lower(coalesce(q.RequirementType, '')) != 'sellitem'
                      )
                      or exists (
                        select 1 from HideoutItemRequirements h
                        where h.ItemId = i.BsgId
                      )
                    )
              ''')
          }
          missing_icons = sorted(
              item_id for item_id in required_icon_ids
              if sanitize_file_name(item_id).lower() not in icon_names
          )
          if missing_icons:
              raise SystemExit(f'missing required item icons: {len(missing_icons)}')

          requirement_types = {
              row[0].lower() for row in connection.execute(
                  "select distinct coalesce(RequirementType, '') from QuestRequiredItems"
              )
          }
          if requirement_types != {'giveitem'}:
              raise SystemExit(f'unexpected requirement types: {sorted(requirement_types)}')

          print(
              'published release verified:',
              'icons=', len(icon_names),
              'required_icons=', len(required_icon_ids),
              'items=', connection.execute('select count(*) from Items').fetchone()[0],
              'quests=', connection.execute('select count(*) from Quests').fetchone()[0]
          )
          connection.close()
          '@ | Set-Content verify_published.py -Encoding utf8

          python verify_published.py $zipPath $dbPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "hash=$actualHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Published v1.6.3 verified: SHA-256 $actualHash"

      - name: Upload verified published assets
        uses: actions/upload-artifact@v4
        with:
          name: TarkovHelper_JH-v1.6.3-published-verified
          path: |
            published/TarkovHelper_JH.zip
            published/TarkovHelper_JH.zip.sha256
          if-no-files-found: error
