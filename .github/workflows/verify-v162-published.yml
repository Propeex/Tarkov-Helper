# One-time verification trigger
name: Verify v1.6.2 Published Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Download and verify published assets
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path verify -Force | Out-Null
          gh release download v1.6.2 --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip" --dir verify
          if ($LASTEXITCODE -ne 0) { throw "Failed to download published ZIP." }
          gh release download v1.6.2 --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip.sha256" --dir verify
          if ($LASTEXITCODE -ne 0) { throw "Failed to download published SHA-256 file." }

          $zipPath = "verify/TarkovHelper_JH.zip"
          $shaPath = "verify/TarkovHelper_JH.zip.sha256"
          $declaredHash = ((Get-Content $shaPath -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declaredHash -ne $actualHash) {
            throw "Published SHA-256 mismatch."
          }

          Expand-Archive $zipPath -DestinationPath verify/extracted -Force
          @'
          import pathlib
          import sqlite3
          import sys
          import zipfile

          zip_path, db_path = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(zip_path) as archive:
              names = [name.replace('\\', '/') for name in archive.namelist()]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate ZIP entries')
              if any(name.startswith('/') or '..' in name.split('/') for name in names):
                  raise SystemExit('unsafe ZIP path')
              forbidden = {
                  'user_data.db', 'quest_progress.json', 'quest_progress_v2.json',
                  'objective_progress.json', 'hideout_progress.json', 'item_inventory.json',
                  'settings.json', 'app_settings.json'
              }
              if any(pathlib.PurePosixPath(name).name.lower() in forbidden or name.lower().endswith('.pdb') for name in names):
                  raise SystemExit('user data or debug file included')
              icons = [name for name in names if name.lower().startswith('assets/icons/') and name.lower().endswith('.png')]
              if len(icons) < 100:
                  raise SystemExit(f'too few icons: {len(icons)}')

          connection = sqlite3.connect(db_path)
          if connection.execute('pragma integrity_check').fetchone()[0] != 'ok':
              raise SystemExit('SQLite integrity check failed')
          if connection.execute('pragma foreign_key_check').fetchall():
              raise SystemExit('SQLite foreign key violation')
          print('icons=', len(icons), 'items=', connection.execute('select count(*) from Items').fetchone()[0], 'quests=', connection.execute('select count(*) from Quests').fetchone()[0])
          connection.close()
          '@ | Set-Content verify_release.py -Encoding utf8

          foreach ($requiredFile in @(
            "verify/extracted/TarkovHelper_JH.exe",
            "verify/extracted/Assets/tarkov_data.db"
          )) {
            if (-not (Test-Path $requiredFile)) { throw "Missing file: $requiredFile" }
          }

          python verify_release.py $zipPath "verify/extracted/Assets/tarkov_data.db"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "hash=$actualHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Record verification on PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 4 --repo $env:GITHUB_REPOSITORY --body "v1.6.2 게시본 검증 성공: SHA-256 `${{ steps.verify.outputs.hash }}`. 게시된 ZIP의 해시, 실행 파일, DB 무결성, 외래키, 아이콘, 사용자 데이터 미포함 검사를 통과했습니다."
