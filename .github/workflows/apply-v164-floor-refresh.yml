name: Apply v1.6.4 Minimap Floor Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/v1.6.4-quest-active-minimap-markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.4-quest-active-minimap-markers
          fetch-depth: 0

      - name: Apply floor-change refresh fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('TarkovHelper/Windows/OverlayMiniMapWindow.xaml.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '    private CancellationTokenSource? _markerLoadCts;\n',
              '    private CancellationTokenSource? _markerLoadCts;\n'
              '    private string? _currentMarkerFloorId;\n')

          start = text.index('    private void OnPositionUpdated(object? sender, ScreenPosition position)')
          end = text.index('\n    private void OnMapChanged', start)
          position_block = (
              '    private void OnPositionUpdated(object? sender, ScreenPosition position)\n'
              '    {\n'
              '        Dispatcher.BeginInvoke(() =>\n'
              '        {\n'
              '            UpdatePlayerMarker(position);\n\n'
              '            if (_settings.ViewMode == MiniMapViewMode.PlayerTracking)\n'
              '            {\n'
              '                CenterOnPlayer(position);\n'
              '            }\n\n'
              '            var detectedFloorId = DetectCurrentFloor(position);\n'
              '            if (!string.Equals(\n'
              '                    _currentMarkerFloorId,\n'
              '                    detectedFloorId,\n'
              '                    StringComparison.OrdinalIgnoreCase))\n'
              '            {\n'
              '                _currentMarkerFloorId = detectedFloorId;\n'
              '                QueueMarkerRefresh();\n'
              '            }\n'
              '        });\n'
              '    }\n'
          )
          text = text[:start] + position_block + text[end:]

          replace_once(
              '            _currentMapKey = mapKey;\n'
              '            _currentMapConfig = _trackerService?.GetMapConfig(mapKey);\n',
              '            _currentMapKey = mapKey;\n'
              '            _currentMapConfig = _trackerService?.GetMapConfig(mapKey);\n'
              '            _currentMarkerFloorId = null;\n')

          replace_once(
              '            var visibility = MiniMapMarkerVisibilityState.Capture(mapSettings);\n\n'
              '            await LoadMapMarkersAsync(visibility, ct);\n'
              '            if (visibility.ShowExtracts)\n'
              '                await LoadExtractMarkersAsync(visibility, ct);\n',
              '            var visibility = MiniMapMarkerVisibilityState.Capture(mapSettings);\n'
              '            var currentFloorId = DetectCurrentFloor();\n'
              '            _currentMarkerFloorId = currentFloorId;\n\n'
              '            await LoadMapMarkersAsync(visibility, currentFloorId, ct);\n'
              '            if (visibility.ShowExtracts)\n'
              '                await LoadExtractMarkersAsync(visibility, currentFloorId, ct);\n')

          replace_once(
              '    private async Task LoadMapMarkersAsync(\n'
              '        MiniMapMarkerVisibilityState visibility,\n'
              '        CancellationToken ct)\n',
              '    private async Task LoadMapMarkersAsync(\n'
              '        MiniMapMarkerVisibilityState visibility,\n'
              '        string? currentFloorId,\n'
              '        CancellationToken ct)\n')

          map_start = text.index('    private async Task LoadMapMarkersAsync(')
          map_end = text.index('\n    private async Task LoadExtractMarkersAsync(', map_start)
          map_segment = text[map_start:map_end]
          old_floor = '        var currentFloorId = DetectCurrentFloor();\n'
          if map_segment.count(old_floor) != 1:
              raise RuntimeError('Could not identify map-marker floor capture.')
          map_segment = map_segment.replace(old_floor, '', 1)
          text = text[:map_start] + map_segment + text[map_end:]

          replace_once(
              '    private async Task LoadExtractMarkersAsync(\n'
              '        MiniMapMarkerVisibilityState visibility,\n'
              '        CancellationToken ct)\n',
              '    private async Task LoadExtractMarkersAsync(\n'
              '        MiniMapMarkerVisibilityState visibility,\n'
              '        string? currentFloorId,\n'
              '        CancellationToken ct)\n')

          extract_start = text.index('    private async Task LoadExtractMarkersAsync(')
          extract_end = text.index('\n    private FrameworkElement CreateMapMarkerElement(', extract_start)
          extract_segment = text[extract_start:extract_end]
          if extract_segment.count(old_floor) != 1:
              raise RuntimeError('Could not identify extract-marker floor capture.')
          extract_segment = extract_segment.replace(old_floor, '', 1)
          text = text[:extract_start] + extract_segment + text[extract_end:]

          replace_once(
              '    private string? DetectCurrentFloor()\n',
              '    private string? DetectCurrentFloor(ScreenPosition? position = null)\n')
          replace_once(
              '        var original = _trackerService?.LastPosition?.OriginalPosition;\n',
              '        var original = position?.OriginalPosition ??\n'
              '                       _trackerService?.LastPosition?.OriginalPosition;\n')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper/Windows/OverlayMiniMapWindow.xaml.cs
          git commit -m "fix: refresh minimap markers when floor changes"
          git push origin HEAD:agent/v1.6.4-quest-active-minimap-markers
