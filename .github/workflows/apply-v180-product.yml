name: Apply v1.8.0 Product

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ammo-scanner-ui-1.8.0' || github.ref_name == 'agent/ammo-scanner-ui-1.8.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/ammo-scanner-ui-1.8.0
          fetch-depth: 0

      - name: Validate and apply product payload
        shell: bash
        run: |
          set -euo pipefail

          echo 'f6abf55f8928ab9575c313cabd4e2dca1ed8036c65e5a786a7c746d0f1e5a087  .github/v180/chunk00' | sha256sum -c -
          echo 'c6feb28a0819f69e616f740c9f4f4e0b54067cf8f32cfb8777a2439a3d6ceda5  .github/v180/chunk01' | sha256sum -c -
          echo 'd4597f2e4227d22c9ea9d3f8dac5e9a8a4f7a4510b5adc0f994d235956391fad  .github/v180/chunk02' | sha256sum -c -
          echo '847d05a08e8dc42324fc70531afa79313327b1a2cda4c37db7c799ff308560dc  .github/v180/chunk03' | sha256sum -c -
          echo '9051ee076bef76875464b179e8294bf924b2ca4966d364815b4e6bc186dc7949  .github/v180/chunk04' | sha256sum -c -
          echo '6f5a746c1d848b0998516fe98a2bfc6088fd5c4a833775c4d603d0f3467547c6  .github/v180/chunk05' | sha256sum -c -
          echo '89d284d2c08259511a8b5281effced9b5dce07e1f59da38ad2a28be23dcdca1c  .github/v180/chunk06a' | sha256sum -c -
          echo '032b5db180e4c217e36eef01c8209b4e651d2c779d3a3be48b0ae59128cb4134  .github/v180/chunk06b-fixed' | sha256sum -c -
          echo '9b7fd12c7a41f10af70c4bcc7fbd2223a9722babc82b56e817d420533b62c6bd  .github/v180/chunk06c' | sha256sum -c -

          cat \
            .github/v180/chunk00 \
            .github/v180/chunk01 \
            .github/v180/chunk02 \
            .github/v180/chunk03 \
            .github/v180/chunk04 \
            .github/v180/chunk05 \
            .github/v180/chunk06a \
            .github/v180/chunk06b-fixed \
            .github/v180/chunk06c > payload.b64

          base64 --decode payload.b64 > payload.zip
          echo 'e328ebf55643afc037fbc57e1db029c9070e602ca92f061a60020e93af0eab06  payload.zip' | sha256sum -c -
          unzip -o payload.zip
          rm -rf .github/v180 payload.b64 payload.zip

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement scanner cleanup and ammo chart v1.8.0'
          git push origin HEAD:agent/ammo-scanner-ui-1.8.0
