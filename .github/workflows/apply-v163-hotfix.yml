name: Apply v1.6.3 Persistence Queue Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'hotfix/v1.6.3-reset-persistence-queues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.6.3-reset-persistence-queues
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          if grep -q '<Version>1.6.3</Version>' TarkovHelper/TarkovHelper.csproj; then
            echo "v1.6.3 patch already applied."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected}, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new))

          def replace_method(path, signature, replacement):
              text = read(path)
              start = text.find(signature)
              if start < 0:
                  raise RuntimeError(f'{path}: signature not found: {signature}')
              brace = text.find('{', start)
              depth = 0
              end = None
              for i in range(brace, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise RuntimeError(f'{path}: method end not found: {signature}')
              write(path, text[:start] + replacement.rstrip() + text[end:])

          write('TarkovHelper/Services/PersistenceWriteQueue.cs', r'''namespace TarkovHelper.Services;

          /// <summary>
          /// Serializes fire-and-forget persistence writes and provides a reset barrier.
          /// Writes queued before a reset either finish before the clear or are discarded.
          /// Writes requested while a reset is active are discarded so they cannot recreate
          /// rows after the reset has completed.
          /// </summary>
          public sealed class PersistenceWriteQueue
          {
              private readonly object _sync = new();
              private Task _tail = Task.CompletedTask;
              private long _generation;
              private bool _resetInProgress;

              public Task Enqueue(Func<Task> operation)
              {
                  ArgumentNullException.ThrowIfNull(operation);

                  lock (_sync)
                  {
                      if (_resetInProgress)
                          return Task.CompletedTask;

                      var generation = _generation;
                      _tail = ExecuteWriteAsync(_tail, generation, operation);
                      return _tail;
                  }
              }

              public Task ResetAsync(Func<Task> clearOperation)
              {
                  ArgumentNullException.ThrowIfNull(clearOperation);

                  lock (_sync)
                  {
                      _generation++;
                      _resetInProgress = true;
                      var generation = _generation;
                      _tail = ExecuteResetAsync(_tail, generation, clearOperation);
                      return _tail;
                  }
              }

              public Task FlushAsync()
              {
                  lock (_sync)
                      return _tail;
              }

              private async Task ExecuteWriteAsync(Task previous, long generation, Func<Task> operation)
              {
                  await ObservePreviousAsync(previous).ConfigureAwait(false);

                  lock (_sync)
                  {
                      if (_resetInProgress || generation != _generation)
                          return;
                  }

                  await operation().ConfigureAwait(false);
              }

              private async Task ExecuteResetAsync(Task previous, long generation, Func<Task> clearOperation)
              {
                  try
                  {
                      await ObservePreviousAsync(previous).ConfigureAwait(false);
                      await clearOperation().ConfigureAwait(false);
                  }
                  finally
                  {
                      lock (_sync)
                      {
                          if (generation == _generation)
                              _resetInProgress = false;
                      }
                  }
              }

              private static async Task ObservePreviousAsync(Task previous)
              {
                  try
                  {
                      await previous.ConfigureAwait(false);
                  }
                  catch
                  {
                      // A later persistence operation or reset must not be blocked by a
                      // previous failed write. Individual services log their own failures.
                  }
              }
          }
          ''')

          replace_exact('TarkovHelper/TarkovHelper.csproj',
              '<Version>1.6.2</Version>\n    <AssemblyVersion>1.6.2.0</AssemblyVersion>\n    <FileVersion>1.6.2.0</FileVersion>',
              '<Version>1.6.3</Version>\n    <AssemblyVersion>1.6.3.0</AssemblyVersion>\n    <FileVersion>1.6.3.0</FileVersion>')
          replace_exact('update.xml', '<version>1.6.2</version>', '<version>1.6.3</version>')

          quest = 'TarkovHelper/Services/QuestProgressService.cs'
          replace_exact(quest,
              '        private ProfileType _loadedProfile = ProfileType.Pvp;\n',
              '        private ProfileType _loadedProfile = ProfileType.Pvp;\n        private readonly PersistenceWriteQueue _persistenceQueue = new();\n')
          replace_exact(quest,
              '                _ = SaveProgressBatchAsync(changedQuests, _loadedProfile);',
              '                _ = _persistenceQueue.Enqueue(() => SaveProgressBatchAsync(changedQuests, _loadedProfile));',
              expected=2)
          replace_exact(quest,
              '                await _userDataDb.SaveQuestProgressBatchAsync(changedItems);',
              '                await _persistenceQueue.Enqueue(() =>\n                    _userDataDb.SaveQuestProgressBatchAsync(changedItems, _loadedProfile));')

          replace_method(quest, '        public void FailQuest(TarkovTask task)', r'''        public void FailQuest(TarkovTask task)
                  {
                      var taskId = task.Ids?.FirstOrDefault();
                      var taskKey = taskId ?? task.NormalizedName;

                      if (string.IsNullOrEmpty(taskKey)) return;

                      _questProgress[taskKey] = QuestStatus.Failed;
                      _ = _persistenceQueue.Enqueue(async () =>
                      {
                          try
                          {
                              await _userDataDb.SaveQuestProgressAsync(
                                  taskId ?? taskKey,
                                  task.NormalizedName,
                                  QuestStatus.Failed,
                                  _loadedProfile);
                          }
                          catch (Exception ex)
                          {
                              System.Diagnostics.Debug.WriteLine(
                                  $"[QuestProgressService] Failed to save failed quest: {ex.Message}");
                          }
                      });
                      ProgressChanged?.Invoke(this, EventArgs.Empty);
                  }''')

          replace_method(quest, '        public void ResetQuest(TarkovTask task)', r'''        public void ResetQuest(TarkovTask task)
                  {
                      var taskId = task.Ids?.FirstOrDefault();
                      var taskKey = taskId ?? task.NormalizedName;

                      if (string.IsNullOrEmpty(taskKey)) return;

                      _questProgress.Remove(taskKey);
                      if (!string.IsNullOrEmpty(task.NormalizedName) && task.NormalizedName != taskKey)
                          _questProgress.Remove(task.NormalizedName);

                      _ = _persistenceQueue.Enqueue(async () =>
                      {
                          try
                          {
                              await _userDataDb.DeleteQuestProgressAsync(taskId ?? taskKey, _loadedProfile);
                              if (!string.IsNullOrEmpty(task.NormalizedName) && task.NormalizedName != taskKey)
                                  await _userDataDb.DeleteQuestProgressAsync(task.NormalizedName, _loadedProfile);
                          }
                          catch (Exception ex)
                          {
                              System.Diagnostics.Debug.WriteLine(
                                  $"[QuestProgressService] Failed to delete quest progress: {ex.Message}");
                          }
                      });
                      ProgressChanged?.Invoke(this, EventArgs.Empty);
                  }''')

          replace_method(quest, '        public async Task ResetAllProgressAsync(ProfileType? profileType = null)', r'''        public async Task ResetAllProgressAsync(ProfileType? profileType = null)
                  {
                      var actualProfile = profileType ?? _loadedProfile;
                      ResetInMemoryProgress();

                      await Task.WhenAll(
                          _persistenceQueue.ResetAsync(() =>
                              _userDataDb.ClearAllQuestProgressAsync(actualProfile)),
                          ObjectiveProgressService.Instance.ClearAllProgressAsync(actualProfile));
                  }''')

          replace_method(quest, '        private void SaveProgress()', r'''        private void SaveProgress()
                  {
                      var profileType = ProfileService.Instance.CurrentProfile;
                      _ = _persistenceQueue.Enqueue(() => SaveProgressToDbAsync(profileType));
                  }''')

          replace_method(quest, '        private void SaveSingleQuestProgress(string normalizedName, QuestStatus status)', r'''        private void SaveSingleQuestProgress(string normalizedName, QuestStatus status)
                  {
                      _ = _persistenceQueue.Enqueue(async () =>
                      {
                          try
                          {
                              string id = normalizedName;
                              if (_tasksByNormalizedName.TryGetValue(normalizedName, out var task))
                                  id = task.Ids?.FirstOrDefault() ?? normalizedName;

                              await _userDataDb.SaveQuestProgressAsync(
                                  id,
                                  normalizedName,
                                  status,
                                  _loadedProfile);
                          }
                          catch (Exception ex)
                          {
                              System.Diagnostics.Debug.WriteLine(
                                  $"[QuestProgressService] Failed to save single quest progress: {ex.Message}");
                          }
                      });
                  }''')

          replace_method(quest, '        private void DeleteSingleQuestProgress(string normalizedName)', r'''        private void DeleteSingleQuestProgress(string normalizedName)
                  {
                      _ = _persistenceQueue.Enqueue(async () =>
                      {
                          try
                          {
                              string id = normalizedName;
                              if (_tasksByNormalizedName.TryGetValue(normalizedName, out var task))
                                  id = task.Ids?.FirstOrDefault() ?? normalizedName;

                              await _userDataDb.DeleteQuestProgressAsync(id, _loadedProfile);
                          }
                          catch (Exception ex)
                          {
                              System.Diagnostics.Debug.WriteLine(
                                  $"[QuestProgressService] Failed to delete quest progress: {ex.Message}");
                          }
                      });
                  }''')

          quest_text = read(quest)
          marker = '        public void ResetAllProgress()\n        {\n            ResetAllProgressAsync().GetAwaiter().GetResult();\n        }'
          replacement = marker + '\n\n        public Task FlushPersistenceAsync() => _persistenceQueue.FlushAsync();'
          if marker not in quest_text:
              raise RuntimeError('Quest flush insertion marker missing')
          write(quest, quest_text.replace(marker, replacement, 1))

          objective = 'TarkovHelper/Services/ObjectiveProgressService.cs'
          replace_exact(objective,
              '        private readonly UserDataDbService _userDataDb = UserDataDbService.Instance;\n',
              '        private readonly UserDataDbService _userDataDb = UserDataDbService.Instance;\n        private readonly PersistenceWriteQueue _persistenceQueue = new();\n')
          replace_exact(objective,
              '            _ = SaveObjectiveProgressBatchAsync(keysToSave);',
              '            _ = _persistenceQueue.Enqueue(() => SaveObjectiveProgressBatchAsync(keysToSave));',
              expected=2)
          replace_method(objective, '        public async Task ClearAllProgressAsync(ProfileType? profileType = null)', r'''        public async Task ClearAllProgressAsync(ProfileType? profileType = null)
                  {
                      ResetInMemoryProgress();
                      await _persistenceQueue.ResetAsync(() =>
                          _userDataDb.ClearAllObjectiveProgressAsync());
                  }''')
          replace_method(objective, '        public void SaveObjectiveProgress()', r'''        public void SaveObjectiveProgress()
                  {
                      _ = _persistenceQueue.Enqueue(SaveObjectiveProgressToDbAsync);
                  }''')
          objective_text = read(objective)
          marker = '        public void ClearAllProgress()\n        {\n            ClearAllProgressAsync().GetAwaiter().GetResult();\n        }'
          replacement = marker + '\n\n        public Task FlushPersistenceAsync() => _persistenceQueue.FlushAsync();'
          if marker not in objective_text:
              raise RuntimeError('Objective flush insertion marker missing')
          write(objective, objective_text.replace(marker, replacement, 1))

          hideout = 'TarkovHelper/Services/HideoutProgressService.cs'
          replace_exact(hideout,
              '        private readonly UserDataDbService _userDataDb = UserDataDbService.Instance;\n',
              '        private readonly UserDataDbService _userDataDb = UserDataDbService.Instance;\n        private readonly PersistenceWriteQueue _persistenceQueue = new();\n')
          replace_method(hideout, '        private void SaveSingleModule(string normalizedName, int level)', r'''        private void SaveSingleModule(string normalizedName, int level)
                  {
                      _ = _persistenceQueue.Enqueue(async () =>
                      {
                          try
                          {
                              await _userDataDb.SaveHideoutProgressAsync(
                                  normalizedName,
                                  level,
                                  _loadedProfile);
                          }
                          catch (Exception ex)
                          {
                              _log.Error($"Save failed: {ex.Message}");
                          }
                      });
                  }''')
          replace_method(hideout, '        public async Task ResetAllProgressAsync(ProfileType? profileType = null)', r'''        public async Task ResetAllProgressAsync(ProfileType? profileType = null)
                  {
                      var actualProfile = profileType ?? _loadedProfile;
                      ResetInMemoryProgress();
                      await _persistenceQueue.ResetAsync(() =>
                          _userDataDb.ClearAllHideoutProgressAsync(actualProfile));
                  }''')
          replace_method(hideout, '        private void SaveProgress()', r'''        private void SaveProgress()
                  {
                      _ = _persistenceQueue.Enqueue(SaveProgressToDbAsync);
                  }''')
          hideout_text = read(hideout)
          marker = '        public void ResetAllProgress()\n        {\n            ResetAllProgressAsync().GetAwaiter().GetResult();\n        }'
          replacement = marker + '\n\n        public Task FlushPersistenceAsync() => _persistenceQueue.FlushAsync();'
          if marker not in hideout_text:
              raise RuntimeError('Hideout flush insertion marker missing')
          write(hideout, hideout_text.replace(marker, replacement, 1))

          write('TarkovHelper/Services/UserProgressResetService.cs', r'''using TarkovHelper.Models;

          namespace TarkovHelper.Services;

          public sealed class UserProgressResetService
          {
              private static UserProgressResetService? _instance;
              public static UserProgressResetService Instance => _instance ??= new UserProgressResetService();

              private readonly SemaphoreSlim _resetGate = new(1, 1);

              private UserProgressResetService()
              {
              }

              public async Task ResetCurrentProfileAsync()
              {
                  await _resetGate.WaitAsync();
                  try
                  {
                      var profile = ProfileService.Instance.CurrentProfile;

                      await Task.WhenAll(
                          QuestProgressService.Instance.ResetAllProgressAsync(profile),
                          HideoutProgressService.Instance.ResetAllProgressAsync(profile));
                      await ItemInventoryService.Instance.ResetAllInventoryAsync(profile);

                      ResetAllInMemoryServices();
                      var counts = await GetRowCountsAsync(profile);
                      if (counts != (0, 0, 0, 0))
                      {
                          throw new InvalidDataException(
                              $"Reset verification failed: quests={counts.Quests}, " +
                              $"objectives={counts.Objectives}, hideout={counts.Hideout}, " +
                              $"inventory={counts.Inventory}.");
                      }
                  }
                  finally
                  {
                      _resetGate.Release();
                  }
              }

              private static async Task<(int Quests, int Objectives, int Hideout, int Inventory)> GetRowCountsAsync(
                  ProfileType profile)
              {
                  var database = UserDataDbService.Instance;
                  var quests = await database.LoadQuestProgressAsync(profile);
                  var objectives = await database.LoadObjectiveProgressAsync();
                  var hideout = await database.LoadHideoutProgressAsync(profile);
                  var inventory = await database.LoadItemInventoryAsync(profile);
                  return (quests.Count, objectives.Count, hideout.Count, inventory.Count);
              }

              private static void ResetAllInMemoryServices()
              {
                  QuestProgressService.Instance.ResetInMemoryProgress();
                  ObjectiveProgressService.Instance.ResetInMemoryProgress();
                  HideoutProgressService.Instance.ResetInMemoryProgress();
                  ItemInventoryService.Instance.ResetInMemoryInventory();
              }
          }
          ''')

          program = 'TarkovHelper.DatabaseSmoke/Program.cs'
          replace_exact(program,
              '    await RunUserProgressResetSmokeAsync();\n    RunApplicationBehaviorSmoke();',
              '    await RunPersistenceWriteQueueSmokeAsync();\n    await RunUserProgressResetSmokeAsync();\n    RunApplicationBehaviorSmoke();')
          program_text = read(program)
          marker = 'static async Task RunUserProgressResetSmokeAsync()'
          queue_smoke = r'''static async Task RunPersistenceWriteQueueSmokeAsync()
          {
              var queue = new PersistenceWriteQueue();
              var writeStarted = new TaskCompletionSource(TaskCreationOptions.RunContinuationsAsynchronously);
              var releaseWrite = new TaskCompletionSource(TaskCreationOptions.RunContinuationsAsynchronously);
              var state = 0;

              _ = queue.Enqueue(async () =>
              {
                  writeStarted.TrySetResult();
                  await releaseWrite.Task;
                  state = 1;
              });

              await writeStarted.Task;
              var resetTask = queue.ResetAsync(() =>
              {
                  state = 0;
                  return Task.CompletedTask;
              });

              var writeDuringReset = queue.Enqueue(() =>
              {
                  state = 2;
                  return Task.CompletedTask;
              });

              releaseWrite.TrySetResult();
              await Task.WhenAll(resetTask, writeDuringReset);
              if (state != 0)
                  throw new InvalidDataException($"Persistence reset barrier failed: state={state}.");

              await queue.Enqueue(() =>
              {
                  state = 3;
                  return Task.CompletedTask;
              });
              if (state != 3)
                  throw new InvalidDataException("Persistence queue did not resume after reset.");
          }

          '''
          if marker not in program_text:
              raise RuntimeError('Program reset smoke marker missing')
          write(program, program_text.replace(marker, queue_smoke + marker, 1))
          PY

      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper TarkovHelper.DatabaseSmoke update.xml
          git commit -m "v1.6.3 초기화 저장 큐 직렬화"
          git push origin HEAD:hotfix/v1.6.3-reset-persistence-queues
