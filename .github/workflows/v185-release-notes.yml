name: Correct v1.8.5 Release Notes

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  update-notes:
    if: github.event.release.tag_name == 'v1.8.5'
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 타르코프헬퍼_JH 1.8.5

          Escape from Tarkov PVP 진행도, 아이템, 은신처, 탄약 및 지도 정보를 관리하는 Windows용 도우미입니다.

          ### v1.8.5 긴급 수정
          - v1.8.4에서 창 초기화 중 전역 탭 이벤트가 아직 생성되지 않은 UI 컨트롤에 접근해 실행 직후 종료되던 문제를 수정했습니다.
          - 초기화와 데이터 로딩이 끝나기 전에는 미니맵 탭 유지 이벤트를 실행하지 않도록 보호했습니다.
          - 실제 배포 EXE를 실행해 시작 직후 종료 여부를 검사하는 Startup Smoke CI를 추가했습니다.
          - 미니맵을 켠 상태에서 다른 탭으로 이동해도 미니맵과 추적 기능이 유지되는 동작은 그대로 유지됩니다.

          ### 설치
          1. TarkovHelper_JH.zip을 원하는 폴더에 압축 해제합니다.
          2. TarkovHelper_JH.exe를 실행합니다.
          3. .NET 8 Windows Desktop Runtime이 필요합니다.

          기존 user_data.db는 릴리스 ZIP에 포함되지 않으며 업데이트 시 유지됩니다.
          EOF

          gh release edit v1.8.5 `
            --repo "$GITHUB_REPOSITORY" `
            --title "타르코프헬퍼_JH v1.8.5" `
            --notes-file release-notes.md
