name: Release v1.9.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-v1.9.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Propeex/Tarkov-Helper'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.9.1
      RELEASE_VERSION: 1.9.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check existing release
        id: guard
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$env:RELEASE_TAG already exists; rebuilding will be skipped."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

      - name: Setup .NET
        if: steps.guard.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rebuild live PVP database
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run `
            --project TarkovHelper.DatabaseSmoke/TarkovHelper.DatabaseSmoke.csproj `
            --configuration Release `
            -- `
            --external *> release-database.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content release-database.log
            exit $LASTEXITCODE
          }

          $databasePath = "TarkovHelper.DatabaseSmoke/bin/Release/net8.0-windows/Assets/tarkov_data.db"
          if (-not (Test-Path $databasePath) -or (Get-Item $databasePath).Length -lt 1MB) {
            throw "The externally rebuilt database is missing or unexpectedly small."
          }
          Copy-Item $databasePath "TarkovHelper/Assets/tarkov_data.db" -Force

      - name: Download and convert required item icons
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "TarkovHelper/Assets/Icons" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "TarkovHelper/Assets/Icons" -Force | Out-Null
          dotnet run `
            --project TarkovHelper.IconDownloader/TarkovHelper.IconDownloader.csproj `
            --configuration Release `
            -- `
            --database "TarkovHelper/Assets/tarkov_data.db" `
            --output "TarkovHelper/Assets/Icons" `
            --concurrency 8 *> release-icons.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content release-icons.log
            exit $LASTEXITCODE
          }
          $iconCount = @(Get-ChildItem "TarkovHelper/Assets/Icons" -Filter *.png -File).Count
          if ($iconCount -lt 100) {
            throw "Too few item icons were generated: $iconCount."
          }

      - name: Publish and validate Windows package
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish TarkovHelper/TarkovHelper.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish `
            -p:DebugType=None `
            -p:DebugSymbols=false

          $exePath = "publish/TarkovHelper_JH.exe"
          $databasePath = "publish/Assets/tarkov_data.db"
          if (-not (Test-Path $exePath) -or -not (Test-Path $databasePath)) {
            throw "Required release files are missing."
          }
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exePath)).FileVersion
          if (-not $fileVersion.StartsWith("$env:RELEASE_VERSION.")) {
            throw "Published executable version mismatch: $fileVersion"
          }
          $iconCount = @(Get-ChildItem "publish/Assets/Icons" -Filter *.png -File -ErrorAction SilentlyContinue).Count
          $pdbCount = @(Get-ChildItem publish -Recurse -Filter *.pdb -File -ErrorAction SilentlyContinue).Count
          if ($iconCount -lt 100 -or $pdbCount -ne 0 -or (Get-Item $databasePath).Length -lt 1MB) {
            throw "Published package validation failed: icons=$iconCount pdb=$pdbCount"
          }

          $process = Start-Process -FilePath (Resolve-Path $exePath) -WorkingDirectory (Resolve-Path publish) -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) {
            throw "Published executable exited during the startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          Compress-Archive -Path publish/* -DestinationPath TarkovHelper_JH.zip -Force
          $hash = (Get-FileHash TarkovHelper_JH.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TarkovHelper_JH.zip" | Set-Content TarkovHelper_JH.zip.sha256 -Encoding ascii

      - name: Create GitHub release
        id: publish
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          ## 수정 사항

          - 콘텐츠 교체 도중 `current`가 사라진 경우 검증된 `previous` 콘텐츠를 우선 복구합니다.
          - 불완전한 `staging` 콘텐츠는 활성화하지 않고 제거합니다.
          - 해당 중단 상태를 재현하는 회귀 검사를 추가했습니다.

          ## v1.9.0 포함 주요 기능

          - tarkov.dev PVP 데이터와 필요한 아이템 이미지 직접 갱신
          - 현재·스테이징·이전 콘텐츠 분리와 실패 시 기존 데이터 보존
          - 이전 콘텐츠 복구 및 다운로드 콘텐츠 초기화
          - PVE 선택 UI와 런타임 경로 제거
          - 층 감지 실패 시 지상층 표시
          '@ | Set-Content release-notes.md -Encoding utf8

          git ls-remote --exit-code --tags origin "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            git tag -a $env:RELEASE_TAG -m "Release $env:RELEASE_TAG"
            git push origin $env:RELEASE_TAG
          }

          gh release create $env:RELEASE_TAG `
            TarkovHelper_JH.zip `
            TarkovHelper_JH.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --title "$env:RELEASE_TAG · 콘텐츠 중단 복구 핫픽스" `
            --notes-file release-notes.md `
            --verify-tag

      - name: Verify public release assets
        id: verify
        if: steps.guard.outputs.exists == 'true' || steps.publish.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path public-release -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "TarkovHelper_JH.zip*" `
            --dir public-release `
            --clobber

          $zipPath = "public-release/TarkovHelper_JH.zip"
          $shaPath = "public-release/TarkovHelper_JH.zip.sha256"
          if (-not (Test-Path $zipPath) -or -not (Test-Path $shaPath)) {
            throw "Public release assets are missing."
          }
          $declared = ((Get-Content $shaPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declared -ne $actual) {
            throw "Public release SHA-256 mismatch: declared=$declared actual=$actual"
          }

          Expand-Archive $zipPath -DestinationPath public-extracted -Force
          $exePath = "public-extracted/TarkovHelper_JH.exe"
          $databasePath = "public-extracted/Assets/tarkov_data.db"
          if (-not (Test-Path $exePath) -or -not (Test-Path $databasePath)) {
            throw "Public release required files are missing."
          }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exePath)).FileVersion
          $iconCount = @(Get-ChildItem "public-extracted/Assets/Icons" -Filter *.png -File -ErrorAction SilentlyContinue).Count
          $pdbCount = @(Get-ChildItem public-extracted -Recurse -Filter *.pdb -File -ErrorAction SilentlyContinue).Count
          if (-not $version.StartsWith("$env:RELEASE_VERSION.") -or $iconCount -lt 100 -or $pdbCount -ne 0) {
            throw "Public package validation failed: version=$version icons=$iconCount pdb=$pdbCount"
          }

          @'
          import sqlite3
          database = r"public-extracted/Assets/tarkov_data.db"
          connection = sqlite3.connect(database)
          integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
          foreign_keys = connection.execute("PRAGMA foreign_key_check").fetchall()
          counts = {
              "items": connection.execute("SELECT COUNT(*) FROM Items").fetchone()[0],
              "quests": connection.execute("SELECT COUNT(*) FROM Quests").fetchone()[0],
              "hideout": connection.execute("SELECT COUNT(*) FROM HideoutStations").fetchone()[0],
              "ammo": connection.execute("SELECT COUNT(*) FROM Ammo").fetchone()[0],
          }
          connection.close()
          if integrity != "ok" or foreign_keys:
              raise SystemExit(f"database validation failed: integrity={integrity}, foreign_keys={len(foreign_keys)}")
          print(counts)
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Public release SQLite validation failed."
          }
          Write-Host "PUBLIC_RELEASE_VERIFIED sha256=$actual version=$version icons=$iconCount"

      - name: Remove verified one-time workflow
        if: steps.verify.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/release-v1.9.1.yml
          git commit -m "Remove verified v1.9.1 release workflow"
          git push origin HEAD:main
