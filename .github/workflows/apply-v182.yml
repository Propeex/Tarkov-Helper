name: Apply v1.8.2 requirements

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/quest-item-ammo-ui-1.8.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-item-ammo-ui-1.8.2
          fetch-depth: 0

      - name: Apply quest, item, ammo, and dropdown changes
        run: |
          set -euo pipefail
          python .github/v182/phase1.py
          python .github/v182/phase2.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in [
              Path('TarkovHelper/Pages/AmmoPage.xaml'),
              Path('TarkovHelper/Pages/ItemsPage.xaml'),
              Path('TarkovHelper/Pages/QuestListPage.xaml'),
              Path('TarkovHelper/App.xaml'),
          ]:
              ET.parse(path)
              print(f'XAML/XML parsed: {path}')
          PY

          git rm -f .github/v182/phase1.py .github/v182/phase2.py .github/workflows/apply-v182.yml
          rmdir .github/v182 2>/dev/null || true

      - name: Commit applied changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply v1.8.2 quest item and ammo requirements"
          git push origin HEAD:agent/quest-item-ammo-ui-1.8.2
