name: Remove cancelled v1.9.2 branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete cancelled branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete hotfix/startup-loading-1.9.2 || true
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-cancelled-v1.9.2-branch.yml
          git commit -m "Remove cancelled v1.9.2 cleanup workflow"
          git push origin HEAD:main
