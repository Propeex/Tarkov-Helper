name: Apply v1.8.5 Release Notes

on:
  push:
    branches:
      - hotfix/startup-crash-1.8.5

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/startup-crash-1.8.5
          fetch-depth: 0

      - name: Update release note template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/release.yml')
          text = path.read_text(encoding='utf-8')
          replacement = '''          ### v1.8.5 긴급 수정
          - v1.8.4에서 창 초기화 중 전역 탭 이벤트가 아직 생성되지 않은 UI 컨트롤에 접근해 실행 직후 종료되던 문제 수정
          - 초기화와 데이터 로딩이 끝나기 전에는 미니맵 탭 유지 이벤트를 실행하지 않도록 보호
          - 실제 배포 EXE를 실행해 시작 직후 종료 여부를 검사하는 Startup Smoke CI 추가
          - 미니맵을 켠 상태에서 다른 탭으로 이동해도 미니맵과 추적 기능이 유지되는 v1.8.4 동작은 그대로 유지

'''
          text, count = re.subn(
              r'          ### v1\.8\.4 수정\n.*?\n          ### 설치\n',
              replacement + '          ### 설치\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('v1.8.4 release-note block was not found exactly once')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release.yml
          git commit -m "Update v1.8.5 release notes"
          git push origin HEAD:hotfix/startup-crash-1.8.5
