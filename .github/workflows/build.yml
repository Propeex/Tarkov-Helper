name: Apply Verified Prerequisite Delta

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/quest-data-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify, apply, and commit v3 prerequisite delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin +refs/heads/agent/quest-data-overhaul:refs/remotes/origin/agent/quest-data-overhaul
          git checkout -B agent/quest-data-overhaul refs/remotes/origin/agent/quest-data-overhaul

          echo '631ed3c242ccb397c0a990c341907ba25b527c49704f7b0d639b58478f8432d8  .github/final-patch/v3-delta-00' | sha256sum --check
          echo '16350abeda4fe59a5f92a75489386fe2835ca55072b8f1c838ccc50616b717c7  .github/final-patch/v3-delta-01' | sha256sum --check
          cat .github/final-patch/v3-delta-* > /tmp/v3.gz.b64
          echo '28e3acb05df2eeddc44d94265aa50638c8a1fa6fa980fe669c6f213ea7589b64  /tmp/v3.gz.b64' | sha256sum --check
          base64 --decode /tmp/v3.gz.b64 > /tmp/v3.gz
          echo 'b9a66a4851f78a82eeceb1153bc9a08f27106550c81fb508f5db1ca7573d7d6e  /tmp/v3.gz' | sha256sum --check
          gzip -dc /tmp/v3.gz > /tmp/v3.patch
          echo '53945dd38e377380b12be9416c89f01e9cc189d817f056241f02a7f26c032535  /tmp/v3.patch' | sha256sum --check

          git apply --3way --check /tmp/v3.patch
          git apply --3way /tmp/v3.patch
          test -z "$(git ls-files -u)"
          git diff --check
          grep -q 'questRequirementOldByPair' TarkovHelper/Services/TarkovDataDatabaseBuilder.Writer.cs
          if grep -q 'NormalizeEquivalentAlternativeRequirementGroups' TarkovHelper/Services/QuestDbService.cs; then exit 21; fi
          grep -q 'preservedPrerequisiteGroupRows != 2' TarkovHelper.DatabaseSmoke/Program.cs
          if grep -Eq '^\s*Available\s*,?\s*$' TarkovHelper/Models/QuestStatus.cs; then exit 22; fi
          if grep -R -q 'QuestStatus\.Available' TarkovHelper --include='*.cs'; then exit 23; fi
          if grep -q 'result\.PrerequisitesToComplete' TarkovHelper/MainWindow.xaml.cs; then exit 24; fi

          git rm -r .github/final-patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve verified quest prerequisite groups'
          git push origin HEAD:agent/quest-data-overhaul
