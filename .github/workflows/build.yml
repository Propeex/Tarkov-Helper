name: Inspect Verified Quest Overhaul

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/quest-data-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Apply verified patch and inspect quest persistence
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin +refs/heads/agent/quest-data-overhaul:refs/remotes/origin/agent/quest-data-overhaul
          git checkout -B agent/quest-data-overhaul refs/remotes/origin/agent/quest-data-overhaul
          cat .github/final-patch/v2-* > /tmp/final-overhaul.patch.gz.b64
          echo '76d10a38ed1d3344da3b414790405d5ad85545457d7e2851e36381b7016bde6f  /tmp/final-overhaul.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/final-overhaul.patch.gz.b64 > /tmp/final-overhaul.patch.gz
          echo '029441f8dd6ce05abf9cac68ee60fba6feddadc3cf7df322dfa0ad86ad74f1a8  /tmp/final-overhaul.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/final-overhaul.patch.gz > /tmp/final-overhaul.patch
          echo 'd221a60bbb37b2c31eccc4c33cf9d0b0f77c0978401b57b240c742eeee7d330e  /tmp/final-overhaul.patch' | sha256sum --check
          git apply --3way --check /tmp/final-overhaul.patch
          git apply --3way /tmp/final-overhaul.patch
          test -z "$(git ls-files -u)"
          git diff --check
          echo '--- QuestProgressService diff ---'
          git diff -- TarkovHelper/Services/QuestProgressService.cs
          echo '--- Quest persistence symbols ---'
          grep -R -n -E 'StartQuest|StartedQuest|Explicit|Accepted|active requirement|started' TarkovHelper/Services/QuestProgressService.cs TarkovHelper/Services/UserDataDbService.cs TarkovHelper/Models/QuestStatusPersistence.cs || true
