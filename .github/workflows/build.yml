name: Apply quest condition preservation fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/quest-items-ammo-scanner-1.8.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-items-ammo-scanner-1.8.1
          fetch-depth: 0
      - name: Apply preservation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v181-fix/preserve.patch.gz.b64 | gzip -dc > /tmp/preserve.patch
          git apply --index --whitespace=error-all /tmp/preserve.patch
          git rm -f .github/v181-fix/preserve.patch.gz.b64
          rmdir .github/v181-fix 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Preserve verified quest start conditions during refresh"
          git push origin HEAD:agent/quest-items-ammo-scanner-1.8.1
