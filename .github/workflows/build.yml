name: Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TarkovHelper.sln

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build TarkovHelper.sln --configuration Release --no-restore -clp:ErrorsOnly *> build.log
          exit $LASTEXITCODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
