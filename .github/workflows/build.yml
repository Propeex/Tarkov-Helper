name: Inspect Quest Start Persistence

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/quest-data-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect explicit-start implementation
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin +refs/heads/agent/quest-data-overhaul:refs/remotes/origin/agent/quest-data-overhaul
          git checkout -B agent/quest-data-overhaul refs/remotes/origin/agent/quest-data-overhaul
          cat .github/final-patch/v2-* > /tmp/p.gz.b64
          echo '76d10a38ed1d3344da3b414790405d5ad85545457d7e2851e36381b7016bde6f  /tmp/p.gz.b64' | sha256sum --check
          base64 --decode /tmp/p.gz.b64 > /tmp/p.gz
          echo '029441f8dd6ce05abf9cac68ee60fba6feddadc3cf7df322dfa0ad86ad74f1a8  /tmp/p.gz' | sha256sum --check
          gzip -dc /tmp/p.gz > /tmp/p.patch
          echo 'd221a60bbb37b2c31eccc4c33cf9d0b0f77c0978401b57b240c742eeee7d330e  /tmp/p.patch' | sha256sum --check
          git apply --3way --check /tmp/p.patch
          git apply --3way /tmp/p.patch
          test -z "$(git ls-files -u)"
          git diff --check
          echo '--- explicit start core ---'
          sed -n '530,660p' TarkovHelper/Services/QuestProgressService.cs
          echo '--- explicit start load/save ---'
          sed -n '880,950p' TarkovHelper/Services/QuestProgressService.cs
          echo '--- progress model fields ---'
          grep -R -n -E 'Started|ExplicitStart' TarkovHelper/Models TarkovHelper/Services/QuestProgressService.cs | head -100 || true
