name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply staged maintenance patch
        shell: pwsh
        run: |
          if (-not (Test-Path ".maintenance/b64.00")) {
            Write-Host "No staged maintenance patch."
            exit 0
          }

          $expectedChunks = @{
            "b64.00" = "c60451f91d715690f2f9a17f4bafd5d91bf869701ab346ee96274b767fa7707f"
            "b64.01" = "04aa5a5d2ae1118da53fa3916b38c690daec7447bd138376975e9ac0c19dbe41"
            "b64.02" = "e8fb055fa6ecc8d0efe30ce493829e5105ff3997302880ea95ce891a989bb9f8"
            "b64.03" = "5d7f8dc8d85c46b3a888c7a162b86e98baf33d088b34633a3b882f584d6c9139"
            "b64.04" = "6b217d31cb671c7e8d61eadc1585aad4ca72d63dce1769a29d27437142254dea"
            "b64.05" = "2b8b60b4a045c4fe58fc3b77fd5e4fde0cc7ec0197a38e81f49eba233c10f52b"
            "b64.06" = "8a7c1026e6b32fd5e7ab65bce8f4891ece3e5ae92d11b9150dd9a5c7658862fe"
          }
          foreach ($name in $expectedChunks.Keys | Sort-Object) {
            $actual = (Get-FileHash ".maintenance/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$name $actual"
            if ($actual -ne $expectedChunks[$name]) {
              throw "Staged chunk hash mismatch for ${name}: $actual"
            }
          }

          $encoded = (Get-ChildItem ".maintenance/b64.*" |
            Sort-Object Name |
            ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes(
            "maintenance.patch",
            [Convert]::FromBase64String($encoded))

          $patchHash = (Get-FileHash "maintenance.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne "c6c66697eead8a524daf9413dc6e2e946c9a7ec07e82104a60c72ebb111ea7d5") {
            throw "Staged maintenance patch hash mismatch: $patchHash"
          }

          git apply --whitespace=nowarn maintenance.patch
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Remove-Item ".maintenance" -Recurse -Force
          Remove-Item "maintenance.patch" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply active marker inventory and category fixes"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $targetBranch = if ([string]::IsNullOrWhiteSpace($env:GITHUB_HEAD_REF)) {
            $env:GITHUB_REF_NAME
          } else {
            $env:GITHUB_HEAD_REF
          }
          git push origin "HEAD:$targetBranch"
          exit $LASTEXITCODE

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TarkovHelper.sln

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build TarkovHelper.sln --configuration Release --no-restore -clp:ErrorsOnly *> build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            exit $buildExit
          }

          $env:TARKOV_ICON_SELF_TEST = "1"
          dotnet run --project TarkovHelper.IconDownloader/TarkovHelper.IconDownloader.csproj --configuration Release --no-build *>> build.log
          exit $LASTEXITCODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

  database-smoke:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rebuild and validate tarkov_data.db
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run --project TarkovHelper.DatabaseSmoke/TarkovHelper.DatabaseSmoke.csproj --configuration Release *> database-smoke.log
          exit $LASTEXITCODE

      - name: Upload database smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-smoke-log
          path: database-smoke.log
          if-no-files-found: error

      - name: Upload smoke database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-smoke-db
          path: TarkovHelper.DatabaseSmoke/bin/Release/net8.0-windows/Assets/tarkov_data.db
          if-no-files-found: warn

      - name: Fail if database smoke failed
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

  database-external-smoke:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rebuild from live tarkov.dev data
        id: external
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run --project TarkovHelper.DatabaseSmoke/TarkovHelper.DatabaseSmoke.csproj --configuration Release *> database-external-smoke.log
          exit $LASTEXITCODE

      - name: Upload external smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-external-smoke-log
          path: database-external-smoke.log
          if-no-files-found: error

      - name: Upload externally rebuilt database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-external-smoke-db
          path: TarkovHelper.DatabaseSmoke/bin/Release/net8.0-windows/Assets/tarkov_data.db
          if-no-files-found: warn

      - name: Report external API outage
        if: steps.external.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "Live tarkov.dev smoke failed. The deterministic build and outage-handling smoke remain authoritative; inspect the uploaded log for current service availability."
