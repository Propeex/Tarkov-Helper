name: Apply v1.8.1 Product Changes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/quest-items-ammo-scanner-1.8.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-items-ammo-scanner-1.8.1
          fetch-depth: 0
      - name: Apply product patch and clean transport files
        shell: bash
        run: |
          set -euo pipefail
          git checkout 1ec0d9e5fd268d04bd0543eb995f0025cb27eeb4 -- .github/workflows/build.yml
          cat .github/v181-apply/part* | base64 -d | gzip -dc > /tmp/product.patch
          git apply --index --whitespace=error-all /tmp/product.patch
          git rm -f --ignore-unmatch \
            .github/workflows/export-v181-source.yml \
            .github/workflows/apply-v181.yml \
            .github/v181/chunk00 \
            .github/v181/chunk01 \
            .github/v181/chunk04 \
            .github/v181/chunk05 \
            .github/v181-apply/part00 \
            .github/v181-apply/part01 \
            .github/v181-apply/part02 \
            .github/v181-apply/part03 \
            .github/v181-apply/part04 \
            .github/v181-apply/part05
          rmdir .github/v181-apply 2>/dev/null || true
          rmdir .github/v181 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement v1.8.1 quest, ammo, and scanner changes"
          git push origin HEAD:agent/quest-items-ammo-scanner-1.8.1
