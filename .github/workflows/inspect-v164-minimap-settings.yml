name: Inspect v1.6.4 Minimap Settings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/v1.6.4-quest-active-minimap-markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.4-quest-active-minimap-markers

      - name: Collect minimap and hotkey sources
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path('TarkovHelper')
          out = Path('minimap-inspection')
          out.mkdir(exist_ok=True)
          terms = (
              'OverlayMiniMap', 'Minimap', 'MiniMap', 'ZoomIn', 'ZoomOut',
              'Hotkey', 'HotKey', 'GlobalKeyboardHook', 'FloorKey',
              'KeyGesture', 'KeyBinding', 'Opacity'
          )

          selected = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.cs', '.xaml'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              if any(term.lower() in path.as_posix().lower() or term in text for term in terms):
                  selected.append(path)
                  target = out / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)

          index = out / 'INDEX.txt'
          index.write_text('\n'.join(p.as_posix() for p in selected), encoding='utf-8')
          print(f'Collected {len(selected)} files')
          print(index.read_text(encoding='utf-8'))

      - uses: actions/upload-artifact@v4
        with:
          name: v164-minimap-settings-inspection
          path: minimap-inspection
          if-no-files-found: error
