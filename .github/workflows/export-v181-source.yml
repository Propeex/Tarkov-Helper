name: Export v1.8.1 Source

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    if: github.head_ref == 'agent/quest-items-ammo-scanner-1.8.1' || github.ref_name == 'agent/quest-items-ammo-scanner-1.8.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-items-ammo-scanner-1.8.1
      - name: Pack source
        run: |
          tar --exclude='.git' --exclude='.github/workflows/export-v181-source.yml' --exclude='source.tar.gz' -czf /tmp/source.tar.gz .
          mv /tmp/source.tar.gz source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: v181-source
          path: source.tar.gz
          if-no-files-found: error
