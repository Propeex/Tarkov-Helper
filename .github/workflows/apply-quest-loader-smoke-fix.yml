name: Apply Quest Loader Smoke Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/pvp-content-updater
          fetch-depth: 0

      - name: Apply verified test-path fix
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="21296f93bd4f4640a1da5e81b08d15c7f041c6ad6b1bd6ce7f68b421982fcb49"
          actual_sha="$(sha256sum .github/quest-loader-smoke.patch | awk '{print $1}')"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Patch SHA-256 mismatch: expected=$expected_sha actual=$actual_sha" >&2
            exit 1
          fi

          git apply --index --whitespace=error-all .github/quest-loader-smoke.patch
          rm -f .github/quest-loader-smoke.patch .github/workflows/apply-quest-loader-smoke-fix.yml
          git add -A
          git diff --cached --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix mutable content quest loader smoke"
          git push origin HEAD:agent/pvp-content-updater
