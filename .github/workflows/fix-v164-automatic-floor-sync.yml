name: Fix v1.6.4 Automatic Floor Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/v1.6.4-quest-active-minimap-markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.4-quest-active-minimap-markers
          fetch-depth: 0

      - name: Preserve unknown automatic floors and synchronize settings window
        shell: python
        run: |
          from pathlib import Path

          def replace_method(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          window = Path('TarkovHelper/Windows/OverlayMiniMapWindow.xaml.cs')
          text = window.read_text(encoding='utf-8')

          text = replace_method(
              text,
              '    private void OnPositionUpdated(object? sender, ScreenPosition position)',
              '    private void OnMapChanged(string mapKey)',
              '''    private void OnPositionUpdated(object? sender, ScreenPosition position)
          {
              Dispatcher.BeginInvoke(() =>
              {
                  UpdatePlayerMarker(position);

                  if (_settings.ViewMode == MiniMapViewMode.PlayerTracking)
                      CenterOnPlayer(position);

                  if (!_settings.AutoFloorSelection || _manualFloorSelection)
                      return;

                  var automaticFloorId = MiniMapFloorSelection.SelectAutomatic(
                      _currentMapConfig?.Floors,
                      DetectCurrentFloor(position));
                  if (string.Equals(
                          _selectedFloorId,
                          automaticFloorId,
                          StringComparison.OrdinalIgnoreCase))
                  {
                      return;
                  }

                  _selectedFloorId = automaticFloorId;
                  UpdateFloorIndicator();
                  QueueFloorRender(fitMap: false);
              });
          }

          ''')

          text = replace_method(
              text,
              '    private void SelectInitialFloor()',
              '    private IReadOnlyList<MapFloorConfig> GetOrderedFloors()',
              '''    private void SelectInitialFloor()
          {
              _selectedFloorId = _settings.AutoFloorSelection
                  ? MiniMapFloorSelection.SelectAutomatic(
                      _currentMapConfig?.Floors,
                      DetectCurrentFloor())
                  : MiniMapFloorSelection.SelectInitial(
                      _currentMapConfig?.Floors,
                      preferredFloorId: null);
              UpdateFloorIndicator();
          }

          ''')

          configured_marker = '    private bool IsConfiguredFloor(string floorId) =>'
          if configured_marker in text:
              text = replace_method(
                  text,
                  configured_marker,
                  '    private void QueueFloorRender(bool fitMap)',
                  '')

          text = text.replace('ApplyDetectedFloorIfAvailable()', 'ApplyAutomaticFloorSelection()')
          text = replace_method(
              text,
              '    private bool ApplyAutomaticFloorSelection()',
              '    public void CenterPlayer()',
              '''    private bool ApplyAutomaticFloorSelection()
          {
              var automaticFloorId = MiniMapFloorSelection.SelectAutomatic(
                  _currentMapConfig?.Floors,
                  DetectCurrentFloor());
              if (string.Equals(
                      _selectedFloorId,
                      automaticFloorId,
                      StringComparison.OrdinalIgnoreCase))
              {
                  return false;
              }

              _selectedFloorId = automaticFloorId;
              return true;
          }

          ''')
          window.write_text(text, encoding='utf-8', newline='\n')

          settings_window = Path('TarkovHelper/Windows/Dialogs/OverlaySettingsWindow.xaml.cs')
          text = settings_window.read_text(encoding='utf-8')
          assignment = '        _overlayWindow = overlayWindow;\n'
          subscription = (
              assignment +
              '        if (_overlayWindow != null)\n'
              '            _overlayWindow.SettingsChanged += OnOverlaySettingsChanged;\n')
          if 'SettingsChanged += OnOverlaySettingsChanged' not in text:
              if text.count(assignment) != 1:
                  raise RuntimeError('Could not identify overlay settings-window assignment.')
              text = text.replace(assignment, subscription, 1)

          if 'private void OnOverlaySettingsChanged(' not in text:
              marker = '    private void UpdateDisplays()\n'
              handler = '''    private void OnOverlaySettingsChanged(OverlayMiniMapSettings settings)
          {
              if (!Dispatcher.CheckAccess())
              {
                  Dispatcher.BeginInvoke(() => OnOverlaySettingsChanged(settings));
                  return;
              }

              _settings.CopyFrom(settings);
              _isInitializing = true;
              LoadSettings();
              _isInitializing = false;
          }

          '''
              if text.count(marker) != 1:
                  raise RuntimeError('Could not identify settings display method.')
              text = text.replace(marker, handler + marker, 1)

          close_lines = (
              '        GlobalKeyboardHookService.Instance.OverlayHotkeysSuppressed = false;\n'
              '        base.OnClosed(e);\n')
          close_replacement = (
              '        GlobalKeyboardHookService.Instance.OverlayHotkeysSuppressed = false;\n'
              '        if (_overlayWindow != null)\n'
              '            _overlayWindow.SettingsChanged -= OnOverlaySettingsChanged;\n'
              '        base.OnClosed(e);\n')
          if 'SettingsChanged -= OnOverlaySettingsChanged' not in text:
              if text.count(close_lines) != 1:
                  raise RuntimeError('Could not identify settings-window close cleanup.')
              text = text.replace(close_lines, close_replacement, 1)
          settings_window.write_text(text, encoding='utf-8', newline='\n')

          smoke = Path('TarkovHelper.DatabaseSmoke/Program.cs')
          text = smoke.read_text(encoding='utf-8')
          old = (
              '    if (MiniMapFloorSelection.SelectInitial(floors, null) != "main" ||\n'
              '        MiniMapFloorSelection.SelectInitial(floors, "level3") != "level3" ||\n')
          new = (
              '    if (MiniMapFloorSelection.SelectAutomatic(floors, null) != null ||\n'
              '        MiniMapFloorSelection.SelectAutomatic(floors, "unknown") != null ||\n'
              '        MiniMapFloorSelection.SelectAutomatic(floors, "level3") != "level3" ||\n'
              '        MiniMapFloorSelection.SelectInitial(floors, null) != "main" ||\n'
              '        MiniMapFloorSelection.SelectInitial(floors, "level3") != "level3" ||\n')
          if 'SelectAutomatic(floors, "unknown")' not in text:
              if text.count(old) != 1:
                  raise RuntimeError('Could not identify minimap floor smoke assertions.')
              text = text.replace(old, new, 1)
          smoke.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit floor synchronization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            TarkovHelper/Windows/OverlayMiniMapWindow.xaml.cs \
            TarkovHelper/Windows/Dialogs/OverlaySettingsWindow.xaml.cs \
            TarkovHelper.DatabaseSmoke/Program.cs
          git commit -m "fix: preserve unknown minimap floors and sync settings"
          git push origin HEAD:agent/v1.6.4-quest-active-minimap-markers
