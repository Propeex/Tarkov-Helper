name: PR34 Review Fix Maintenance

on:
  pull_request:
    types: [synchronize]

jobs:
  apply-review-fixes:
    if: github.event.pull_request.number == 34 && github.head_ref == 'agent/quest-catalog-sync-fix'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed fail-closed fixes
        shell: bash
        run: |
          set -euo pipefail
          script=.github/maintenance/apply-pr34-review-fixes.py
          if [[ ! -f "$script" ]]; then
            echo "Maintenance script already consumed; nothing to do."
            exit 0
          fi

          python "$script"
          rm "$script"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper/Services/TarkovDataDatabaseBuilder.JsonApi.cs \
                  TarkovHelper/Services/TarkovDataDatabaseBuilder.Overlay.cs \
                  TarkovHelper.DatabaseSmoke/FixtureTarkovApiHandler.cs \
                  TarkovHelper.DatabaseSmoke/Program.cs \
                  .github/maintenance/apply-pr34-review-fixes.py
          git diff --cached --check
          git commit -m "Harden quest catalog fail-closed behavior"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
