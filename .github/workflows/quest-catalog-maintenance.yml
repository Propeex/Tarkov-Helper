name: Quest Catalog Maintenance

on:
  pull_request:
    types: [reopened]

jobs:
  apply:
    if: github.event.pull_request.number == 34 && github.head_ref == 'agent/quest-catalog-sync-fix'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Normalize deterministic overlay fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('TarkovHelper.DatabaseSmoke/FixtureTarkovApiHandler.cs')
          text = p.read_text(encoding='utf-8')
          task_marker = '["fixture-quest-overlay-added"] = new'
          start = text.find(task_marker)
          if start < 0:
              raise SystemExit('overlay-added task marker missing')
          end = text.find('["prestige"]', start)
          if end < 0:
              raise SystemExit('overlay-added block end marker missing')
          block = text[start:end]
          needle = 'factionName = "Any",'
          if block.count(needle) != 1:
              raise SystemExit(f'overlay-added faction marker count={block.count(needle)}')
          block = block.replace(needle, 'factionName = (string?)null,', 1)
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper.DatabaseSmoke/FixtureTarkovApiHandler.cs
          git diff --cached --check
          git commit -m "Align quest overlay fixture with live task shape"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
