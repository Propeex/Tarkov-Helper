name: PR34 Release Notes Maintenance

on:
  pull_request:
    types: [synchronize]

jobs:
  apply-release-notes:
    if: github.event.pull_request.number == 34 && github.head_ref == 'agent/quest-catalog-sync-fix'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update v1.10.1 release notes
        shell: bash
        run: |
          set -euo pipefail
          script=.github/maintenance/apply-pr34-release-notes.py
          if [[ ! -f "$script" ]]; then
            echo "Maintenance script already consumed; nothing to do."
            exit 0
          fi
          python "$script"
          rm "$script"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml .github/maintenance/apply-pr34-release-notes.py
          git diff --cached --check
          git commit -m "Update v1.10.1 release notes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
