name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Read release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content "TarkovHelper/TarkovHelper.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version could not be read."
          }

          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query existing releases."
          }

          $releaseExists = @($releaseJson | ConvertFrom-Json).tagName -contains $tag
          "exists=$($releaseExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version tag=$tag releaseExists=$releaseExists"

      - name: Rebuild and validate live database
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run `
            --project TarkovHelper.DatabaseSmoke/TarkovHelper.DatabaseSmoke.csproj `
            --configuration Release `
            -- --external *> release-database.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content release-database.log
            exit $LASTEXITCODE
          }

          $databasePath = "TarkovHelper.DatabaseSmoke/bin/Release/net8.0-windows/Assets/tarkov_data.db"
          if (-not (Test-Path $databasePath)) {
            throw "The verified live database was not generated."
          }

          $databaseSize = (Get-Item $databasePath).Length
          if ($databaseSize -lt 1MB) {
            throw "The verified live database is unexpectedly small: $databaseSize bytes."
          }

          Copy-Item $databasePath "TarkovHelper/Assets/tarkov_data.db" -Force

      - name: Upload database rebuild log
        if: always() && steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-database-log
          path: release-database.log
          if-no-files-found: warn

      - name: Download and convert required item icons
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item "TarkovHelper/Assets/Icons" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "TarkovHelper/Assets/Icons" -Force | Out-Null

          dotnet run `
            --project TarkovHelper.IconDownloader/TarkovHelper.IconDownloader.csproj `
            --configuration Release `
            -- `
            --database "TarkovHelper/Assets/tarkov_data.db" `
            --output "TarkovHelper/Assets/Icons" `
            --concurrency 8 *> release-icons.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content release-icons.log
            exit $LASTEXITCODE
          }

          $iconCount = @(Get-ChildItem "TarkovHelper/Assets/Icons" -Filter *.png -File).Count
          if ($iconCount -lt 100) {
            throw "Too few item icons were generated: $iconCount."
          }
          Write-Host "Generated item icons: $iconCount"

      - name: Upload icon download log
        if: always() && steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-icon-log
          path: release-icons.log
          if-no-files-found: warn

      - name: Publish Windows application
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish TarkovHelper/TarkovHelper.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish `
            -p:DebugType=None `
            -p:DebugSymbols=false

          foreach ($requiredFile in @(
            "publish/TarkovHelper_JH.exe",
            "publish/Assets/tarkov_data.db"
          )) {
            if (-not (Test-Path $requiredFile)) {
              throw "Required release file is missing: $requiredFile"
            }
          }

          $publishedIcons = @(Get-ChildItem "publish/Assets/Icons" -Filter *.png -File -ErrorAction SilentlyContinue)
          if ($publishedIcons.Count -lt 100) {
            throw "Published item icons are missing: $($publishedIcons.Count)."
          }

          $forbiddenNames = @(
            "user_data.db",
            "quest_progress.json",
            "quest_progress_v2.json",
            "objective_progress.json",
            "hideout_progress.json",
            "item_inventory.json",
            "settings.json",
            "app_settings.json"
          )
          $forbiddenFiles = Get-ChildItem publish -Recurse -File | Where-Object {
            $_.Extension -eq ".pdb" -or $forbiddenNames -contains $_.Name.ToLowerInvariant()
          }
          if ($forbiddenFiles) {
            $forbiddenFiles | ForEach-Object { Write-Error "Forbidden release file: $($_.FullName)" }
            throw "A user-data or debug file was included in the release directory."
          }

      - name: Create release package
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"

          Compress-Archive -Path publish/* -DestinationPath TarkovHelper_JH.zip -Force
          $hash = (Get-FileHash TarkovHelper_JH.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TarkovHelper_JH.zip" | Set-Content TarkovHelper_JH.zip.sha256 -Encoding ascii

          $notes = @'
          ## 타르코프헬퍼_JH VERSION_PLACEHOLDER

          Escape from Tarkov PVP 진행도, 아이템, 은신처 및 지도 정보를 관리하는 Windows용 도우미입니다.

          ### v1.6.2 수정
          - 초기화 버튼이 퀘스트·목표·은신처 진행도와 보유 아이템을 모두 삭제하고 결과를 재검증하도록 수정
          - 초기화 후 퀘스트 목록이 숨겨지지 않도록 기본 상태 필터를 전체로 변경
          - 아이템 집계 작업을 백그라운드에서 직렬화하고 아이콘 로드를 소규모 배치로 분할
          - 지도 탭의 컴포넌트·정적 데이터 중복 초기화 및 동기 Dispatcher 대기 제거
          - 초기화 통합 smoke와 기존 DB·아이콘·배포 파일 무결성 검증 유지

          ### 설치
          1. TarkovHelper_JH.zip을 원하는 폴더에 압축 해제합니다.
          2. TarkovHelper_JH.exe를 실행합니다.
          3. .NET 8 Windows Desktop Runtime이 필요합니다.

          기존 user_data.db는 릴리즈 ZIP에 포함되지 않으며 업데이트 시 유지됩니다.
          '@.Replace("VERSION_PLACEHOLDER", $version)
          $notes | Set-Content RELEASE_NOTES.md -Encoding utf8

      - name: Upload verified release artifact
        if: steps.version.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TarkovHelper_JH-${{ steps.version.outputs.version }}
          path: |
            TarkovHelper_JH.zip
            TarkovHelper_JH.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release create "${{ steps.version.outputs.tag }}" `
            TarkovHelper_JH.zip `
            TarkovHelper_JH.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "타르코프헬퍼_JH v${{ steps.version.outputs.version }}" `
            --notes-file RELEASE_NOTES.md `
            --latest

      - name: Verify published release and assets
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $expectedTitle = "타르코프헬퍼_JH v$version"

          $release = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json name,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $release) {
            throw "The GitHub Release could not be read."
          }
          if ($release.name -ne $expectedTitle -or $release.isDraft -or $release.isPrerelease) {
            throw "Release metadata is invalid."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredAsset in @("TarkovHelper_JH.zip", "TarkovHelper_JH.zip.sha256")) {
            if ($assetNames -notcontains $requiredAsset) {
              throw "Required release asset is missing: $requiredAsset"
            }
          }

          New-Item -ItemType Directory -Path release-verification -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip" --dir release-verification
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the release ZIP." }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip.sha256" --dir release-verification
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the SHA-256 file." }

          $zipPath = "release-verification/TarkovHelper_JH.zip"
          $shaPath = "release-verification/TarkovHelper_JH.zip.sha256"
          $declaredHash = ((Get-Content $shaPath -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declaredHash -ne $actualHash) {
            throw "Published SHA-256 mismatch: declared=$declaredHash actual=$actualHash"
          }

          Expand-Archive $zipPath -DestinationPath release-verification/extracted -Force
          foreach ($requiredFile in @(
            "release-verification/extracted/TarkovHelper_JH.exe",
            "release-verification/extracted/Assets/tarkov_data.db"
          )) {
            if (-not (Test-Path $requiredFile)) {
              throw "Required file is missing from the published ZIP: $requiredFile"
            }
          }

          @'
          import os
          import pathlib
          import sqlite3
          import sys
          import zipfile

          zip_path, db_path = sys.argv[1], sys.argv[2]
          invalid_filename_chars = set('<>:"/\\|?*')

          def sanitize_file_name(value):
              return ''.join(
                  '_' if char in invalid_filename_chars or ord(char) < 32 else char
                  for char in value
              )

          with zipfile.ZipFile(zip_path) as archive:
              names = archive.namelist()
              normalized = [name.replace('\\', '/') for name in names]
              if len(normalized) != len(set(normalized)):
                  raise SystemExit('duplicate ZIP entries')
              if any(name.startswith('/') or '..' in name.split('/') for name in normalized):
                  raise SystemExit('unsafe ZIP path')

              forbidden = {
                  'user_data.db', 'quest_progress.json', 'quest_progress_v2.json',
                  'objective_progress.json', 'hideout_progress.json', 'item_inventory.json',
                  'settings.json', 'app_settings.json'
              }
              if any(
                  pathlib.PurePosixPath(name).name.lower() in forbidden or name.lower().endswith('.pdb')
                  for name in normalized
              ):
                  raise SystemExit('user-data or debug file included')

              icon_names = {
                  pathlib.PurePosixPath(name).stem.lower()
                  for name in normalized
                  if name.lower().startswith('assets/icons/') and name.lower().endswith('.png')
              }
              if len(icon_names) < 100:
                  raise SystemExit(f'too few packaged item icons: {len(icon_names)}')

          connection = sqlite3.connect(db_path)
          if connection.execute('pragma integrity_check').fetchone()[0] != 'ok':
              raise SystemExit('SQLite integrity_check failed')
          if connection.execute('pragma foreign_key_check').fetchall():
              raise SystemExit('SQLite foreign-key violation')

          required_icon_ids = {
              row[0]
              for row in connection.execute('''
                  select distinct i.Id
                  from Items i
                  where i.IconUrl is not null
                    and trim(i.IconUrl) != ''
                    and (
                      exists (
                        select 1 from QuestRequiredItems q
                        where q.ItemId = i.Id
                          and lower(coalesce(q.RequirementType, '')) != 'sellitem'
                      )
                      or exists (
                        select 1 from HideoutItemRequirements h
                        where h.ItemId = i.BsgId
                      )
                    )
              ''')
          }
          missing_icons = sorted(
              item_id for item_id in required_icon_ids
              if sanitize_file_name(item_id).lower() not in icon_names
          )
          if missing_icons:
              raise SystemExit(
                  f'missing required item icons: {len(missing_icons)}; samples={missing_icons[:10]}'
              )

          requirement_types = {
              row[0].lower() for row in connection.execute(
                  "select distinct coalesce(RequirementType, '') from QuestRequiredItems"
              )
          }
          if requirement_types != {'giveitem'}:
              raise SystemExit(f'unexpected requirement types: {sorted(requirement_types)}')

          print(
              'published release verified:',
              'icons=', len(icon_names),
              'required_icons=', len(required_icon_ids),
              'items=', connection.execute('select count(*) from Items').fetchone()[0],
              'quests=', connection.execute('select count(*) from Quests').fetchone()[0]
          )
          connection.close()
          '@ | Set-Content verify_release.py -Encoding utf8

          python verify_release.py $zipPath "release-verification/extracted/Assets/tarkov_data.db"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "hash=$actualHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($release.url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Report verified release
        if: success()
        shell: pwsh
        run: |
          Write-Host "Release verified: ${{ steps.verify.outputs.url }}"
          Write-Host "SHA-256: ${{ steps.verify.outputs.hash }}"
