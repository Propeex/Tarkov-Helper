name: Apply v1.6.3 Final Reset Barrier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/v1.6.3-reset-persistence-queues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.6.3-reset-persistence-queues
          fetch-depth: 0

      - name: Apply coordinated persistence reset barrier
        shell: python
        run: |
          exec(open('.github/scripts/apply_v163_final.py', encoding='utf-8').read())

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper TarkovHelper.DatabaseSmoke .github/workflows/release.yml
          git commit -m "fix: hold all persistence queues through reset verification"
          git push origin HEAD:hotfix/v1.6.3-reset-persistence-queues
