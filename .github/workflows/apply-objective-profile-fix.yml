name: Apply Objective Profile Isolation Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/v1.6.3-reset-persistence-queues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.6.3-reset-persistence-queues
          fetch-depth: 0

      - name: Apply objective profile isolation fix
        shell: python
        run: |
          path = '.github/scripts/apply_objective_profile_fix.py'
          source = open(path, encoding='utf-8').read()
          source = source.replace('if count != 1:', 'if count < 1:', 1)
          exec(compile(source, path, 'exec'))

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper TarkovHelper.DatabaseSmoke
          git commit -m "fix: capture objective profile before queued persistence"
          git push origin HEAD:hotfix/v1.6.3-reset-persistence-queues
