name: Restore v1.9.0 as latest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable release designation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.9.1 --prerelease
          gh release edit v1.9.0 --latest --prerelease=false
          latest="$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)"
          test "$latest" = "v1.9.0"

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-v1.9.0-latest.yml
          git commit -m "Remove v1.9.0 release restore workflow"
          git push origin HEAD:main
