name: Startup Smoke

on:
  push:
    branches:
      - main
      - agent/**
      - hotfix/**
  pull_request:

permissions:
  contents: write

jobs:
  maintenance-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 31 && github.head_ref == 'agent/quest-data-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/quest-data-overhaul
          fetch-depth: 0

      - name: Apply data-driven prerequisite validation
        shell: bash
        run: |
          set -euo pipefail
          python .github/maintenance/final-live-prerequisite-validation.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarkovHelper.DatabaseSmoke/Program.cs TarkovHelper/Services/TarkovDataDatabaseBuilder.Sql.cs
          git diff --cached --check
          git commit -m 'Validate live prerequisite mapping against API source'
          git push origin HEAD:agent/quest-data-overhaul

  startup-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.number != 31
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore TarkovHelper.sln
          dotnet publish TarkovHelper/TarkovHelper.csproj --configuration Release --runtime win-x64 --self-contained false --output publish -p:DebugType=None -p:DebugSymbols=false
          if (-not (Test-Path "publish/TarkovHelper_JH.exe")) { throw "Published executable is missing." }
      - name: Launch published executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workDir = (Resolve-Path "publish").Path
          $exePath = Join-Path $workDir "TarkovHelper_JH.exe"
          $process = Start-Process -FilePath $exePath -WorkingDirectory $workDir -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited during startup with code $($process.ExitCode)." }
            } while ((Get-Date) -lt $deadline)
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
