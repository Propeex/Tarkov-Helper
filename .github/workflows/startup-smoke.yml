name: Instrument Quest Overhaul Validation

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 31 && github.head_ref == 'agent/quest-data-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fix old-schema fixture and split raw JSON validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin +refs/heads/agent/quest-data-overhaul:refs/remotes/origin/agent/quest-data-overhaul
          git checkout -B agent/quest-data-overhaul refs/remotes/origin/agent/quest-data-overhaul

          python - <<'PY'
          from pathlib import Path

          program = Path('TarkovHelper.DatabaseSmoke/Program.cs')
          text = program.read_text(encoding='utf-8')
          replacements = [
              ("(Id, BsgId, Name, NameEN, NormalizedName, Trader, Location,", "(Id, BsgId, Name, NameEN, Trader, Location,"),
              ("($id, $id, $name, $name, $normalized, 'Trader', 'any',", "($id, $id, $name, $name, 'Trader', 'any',"),
              ('        questCommand.Parameters.AddWithValue("$normalized", questId);\n', ''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Program.cs replacement mismatch for {old!r}: {count}')
              text = text.replace(old, new, 1)
          program.write_text(text, encoding='utf-8')

          sql = Path('TarkovHelper/Services/TarkovDataDatabaseBuilder.Sql.cs')
          text = sql.read_text(encoding='utf-8')
          old = '''        var invalidSourceJson = await ExecuteScalarLongAsync(connection, """
            SELECT
                (SELECT COUNT(*) FROM Items WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1) +
                (SELECT COUNT(*) FROM Quests WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1) +
                (SELECT COUNT(*) FROM QuestObjectives WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1);
            """, cancellationToken);
        if (invalidSourceJson != 0)
            throw new InvalidDataException($"API 원본 JSON 보존 오류: {invalidSourceJson}개");
'''
          new = '''        var invalidItemSourceJson = await ExecuteScalarLongAsync(
            connection,
            "SELECT COUNT(*) FROM Items WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1;",
            cancellationToken);
        var invalidQuestSourceJson = await ExecuteScalarLongAsync(
            connection,
            "SELECT COUNT(*) FROM Quests WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1;",
            cancellationToken);
        var invalidObjectiveSourceJson = await ExecuteScalarLongAsync(
            connection,
            "SELECT COUNT(*) FROM QuestObjectives WHERE SourceJson IS NULL OR json_valid(SourceJson) != 1;",
            cancellationToken);
        var invalidSourceJson = invalidItemSourceJson + invalidQuestSourceJson + invalidObjectiveSourceJson;
        if (invalidSourceJson != 0)
        {
            throw new InvalidDataException(
                $"API 원본 JSON 보존 오류: total={invalidSourceJson}, " +
                $"items={invalidItemSourceJson}, quests={invalidQuestSourceJson}, " +
                $"objectives={invalidObjectiveSourceJson}");
        }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Sql.cs raw JSON validation block mismatch: {count}')
          sql.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '- 퀘스트 시작 시 선행 퀘스트 자동 완료 처리'
          new = '- 실제 수주·완료 기록과 선행 조건을 분리하여 안전하게 진행도 추적'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'README replacement mismatch: {count}')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarkovHelper.DatabaseSmoke/Program.cs TarkovHelper/Services/TarkovDataDatabaseBuilder.Sql.cs README.md
          git diff --cached --check
          git commit -m 'Harden database regression validation'
          git push origin HEAD:agent/quest-data-overhaul
