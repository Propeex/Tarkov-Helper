name: Apply quest overhaul once

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/quest-data-overhaul
  APPLY_REVISION: v3

jobs:
  apply:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.issue.number == 31 && github.event.comment.body == '/apply-validated-v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Execute validated branch script
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Applying ${APPLY_REVISION} to ${TARGET_BRANCH}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/agent-apply-patch.yml?ref=${TARGET_BRANCH}"
          status=$(curl --silent --output /tmp/workflow.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          if [ "$status" = "404" ]; then
            echo 'Validated apply script is already absent; nothing remains to apply.'
            exit 0
          fi
          if [ "$status" != "200" ]; then
            cat /tmp/workflow.json
            exit 1
          fi

          python - <<'PY'
          import base64, json, pathlib
          document = json.loads(pathlib.Path('/tmp/workflow.json').read_text(encoding='utf-8'))
          content = base64.b64decode(document['content']).decode('utf-8')
          marker = '        run: |\n'
          if marker not in content:
              raise SystemExit('Validated run block was not found.')
          block = content.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line and not line.startswith('          '):
                  break
              lines.append(line[10:] if line.startswith('          ') else '')
          pathlib.Path('/tmp/final-overhaul-apply.sh').write_text(
              '\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

          bash /tmp/final-overhaul-apply.sh
