name: Apply v1.8.4 Release Metadata

on:
  push:
    branches:
      - hotfix/minimap-tab-persistence-1.8.4
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/minimap-tab-persistence-1.8.4
          fetch-depth: 0

      - name: Apply version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          project_path = Path('TarkovHelper/TarkovHelper.csproj')
          project = project_path.read_text(encoding='utf-8')
          project = project.replace('<Version>1.8.3</Version>', '<Version>1.8.4</Version>')
          project = project.replace('<AssemblyVersion>1.8.3.0</AssemblyVersion>', '<AssemblyVersion>1.8.4.0</AssemblyVersion>')
          project = project.replace('<FileVersion>1.8.3.0</FileVersion>', '<FileVersion>1.8.4.0</FileVersion>')
          project_path.write_text(project, encoding='utf-8')

          update_path = Path('update.xml')
          update = update_path.read_text(encoding='utf-8')
          update = update.replace('<version>1.8.3</version>', '<version>1.8.4</version>')
          update_path.write_text(update, encoding='utf-8')

          release_path = Path('.github/workflows/release.yml')
          release = release_path.read_text(encoding='utf-8')
          notes = '''          ### v1.8.4 수정
          - 미니맵을 켠 상태에서 퀘스트·은신처·아이템·총알·스캐너 탭으로 이동해도 미니맵 창과 추적 기능이 유지되도록 수정
          - 일반 탭 전환과 프로필 전환·앱 종료를 구분하여 페이지 교체와 종료 시에는 기존 자원 정리를 유지
          - 반복적인 지도 탭 진입과 이탈에서도 미니맵 이벤트 구독이 중복되지 않도록 정규화

'''
          release, count = re.subn(
              r'          ### v1\.8\.3 수정\n.*?\n          ### 설치\n',
              notes + '          ### 설치\n',
              release,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('v1.8.3 release-note block was not found exactly once')
          release_path.write_text(release, encoding='utf-8')
          PY

          git rm -f .github/workflows/apply-v184-release-metadata.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TarkovHelper/TarkovHelper.csproj update.xml .github/workflows/release.yml
          git commit -m "Set v1.8.4 release metadata"
          git push origin HEAD:hotfix/minimap-tab-persistence-1.8.4
