name: Apply v1.8.2 status cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/quest-item-ammo-ui-1.8.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-item-ammo-ui-1.8.2
          fetch-depth: 0

      - name: Remove remaining Available runtime references
        run: |
          set -euo pipefail
          python .github/v182-cleanup/cleanup.py

          remaining="$(git grep -n 'QuestStatus.Available' -- '*.cs' ':!TarkovHelper/Models/QuestStatus.cs' || true)"
          if [ -n "$remaining" ]; then
            echo "$remaining"
            echo 'QuestStatus.Available is still referenced at runtime.' >&2
            exit 1
          fi

          git rm -f .github/v182-cleanup/cleanup.py .github/workflows/apply-v182-cleanup.yml
          rmdir .github/v182-cleanup 2>/dev/null || true

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove legacy Available status usage"
          git push origin HEAD:agent/quest-item-ammo-ui-1.8.2
