name: Apply Agent Content Update

on:
  push:
    branches:
      - agent/pvp-content-updater
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-agent-content-update
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pvp-content-updater
          fetch-depth: 0

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail

          expected_lengths=(10000 10000 10000 7876)
          expected_hashes=(
            5050e174e9101b3d3782c60d176f1017166371877157a32bbf4f51a5e44630a1
            c162df4ae6dd9cec5fbf302083d8706745386de99b5b8348411eeb007674d982
            ed16ad924d150313c9438251f78226c9a306f6e740aa9e559527e7752b783d57
            a7e59b86966a44a8768e1367c16f996d688f0899df2f9cb1c465bd2af713215c
          )

          for index in 1 2 3 4; do
            part=".github/agent-content-update.part${index}"
            actual_length="$(wc -c < "$part" | tr -d ' ')"
            actual_hash="$(sha256sum "$part" | awk '{print $1}')"
            expected_length="${expected_lengths[$((index - 1))]}"
            expected_hash="${expected_hashes[$((index - 1))]}"
            echo "part${index}: length=$actual_length sha256=$actual_hash"
            if [[ "$actual_length" != "$expected_length" || "$actual_hash" != "$expected_hash" ]]; then
              echo "Part ${index} mismatch: expected_length=$expected_length expected_hash=$expected_hash" >&2
              exit 1
            fi
          done

          cat \
            .github/agent-content-update.part1 \
            .github/agent-content-update.part2 \
            .github/agent-content-update.part3 \
            .github/agent-content-update.part4 \
            | base64 --decode > /tmp/content.patch.gz

          actual_sha="$(sha256sum /tmp/content.patch.gz | awk '{print $1}')"
          expected_sha="8cdc26e8ac261c1ebc5bab06b51c2e7f6cac72dae06d53abd68d7b7dd7cdc1b1"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Payload SHA-256 mismatch: expected=$expected_sha actual=$actual_sha" >&2
            exit 1
          fi

          gzip --decompress --stdout /tmp/content.patch.gz > /tmp/content.patch
          git apply --index --whitespace=error-all /tmp/content.patch

          rm -f \
            .github/agent-content-update.part1 \
            .github/agent-content-update.part2 \
            .github/agent-content-update.part3 \
            .github/agent-content-update.part4 \
            .github/workflows/source-snapshot.yml \
            .github/workflows/apply-agent-content-update.yml
          git add -A
          git diff --cached --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement safe PVP content updater"
          git push origin HEAD:agent/pvp-content-updater
