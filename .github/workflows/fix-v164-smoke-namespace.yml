name: Fix v1.6.4 Minimap Smoke Namespace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/v1.6.4-quest-active-minimap-markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.4-quest-active-minimap-markers
          fetch-depth: 0

      - name: Qualify minimap SVG preprocessor
        shell: python
        run: |
          from pathlib import Path
          path = Path('TarkovHelper.DatabaseSmoke/Program.cs')
          text = path.read_text(encoding='utf-8')
          old = '    var processed = new SvgStylePreprocessor().ProcessSvgContent(\n'
          new = '    var processed = new TarkovHelper.Services.Map.SvgStylePreprocessor().ProcessSvgContent(\n'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one smoke preprocessor call, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Commit smoke fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper.DatabaseSmoke/Program.cs
          git commit -m "test: qualify minimap SVG preprocessor"
          git push origin HEAD:agent/v1.6.4-quest-active-minimap-markers
