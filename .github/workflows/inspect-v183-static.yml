name: Export Current v1.8.3 Source

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/item-categories-ammo-sources-1.8.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive current source
        shell: bash
        run: git archive --format=zip --output=current-v183-source.zip HEAD
      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: current-v183-source
          path: current-v183-source.zip
          if-no-files-found: error
