name: Inspect v1.8.3 Static Data

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/item-categories-ammo-sources-1.8.3'
    runs-on: ubuntu-latest
    steps:
      - name: Download static API documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir static-data
          curl --fail --retry 4 --retry-all-errors --location --output static-data/items.json https://json.tarkov.dev/regular/items
          curl --fail --retry 4 --retry-all-errors --location --output static-data/traders.json https://json.tarkov.dev/regular/traders
          curl --fail --retry 4 --retry-all-errors --location --output static-data/hideout.json https://json.tarkov.dev/regular/hideout
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('static-data').glob('*.json'):
              data=json.loads(path.read_text(encoding='utf-8'))
              print(path.name, type(data).__name__, list(data)[:20] if isinstance(data,dict) else len(data))
          PY
      - name: Upload static data
        uses: actions/upload-artifact@v4
        with:
          name: v183-static-data
          path: static-data
          if-no-files-found: error
