name: Fix v1.6.4 Shared Extract Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/v1.6.4-quest-active-minimap-markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.6.4-quest-active-minimap-markers
          fetch-depth: 0

      - name: Add shared extract category regression
        shell: python
        run: |
          from pathlib import Path
          path = Path('TarkovHelper.DatabaseSmoke/Program.cs')
          text = path.read_text(encoding='utf-8')
          marker = '    var extractsDisabled = markerVisibility with { ShowExtracts = false };\n'
          addition = '''    var scavOnlyExtracts = markerVisibility with
          {
              ShowPmcExtracts = false,
              ShowScavExtracts = true
          };
          if (scavOnlyExtracts.IsExtractVisible(ExtractFaction.Shared))
          {
              throw new InvalidDataException(
                  "Shared extracts must follow the PMC filter exactly like the map tab.");
          }

          '''
          if 'Shared extracts must follow the PMC filter' not in text:
              if text.count(marker) != 1:
                  raise RuntimeError('Could not identify extract visibility smoke insertion point.')
              text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit smoke and remove temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TarkovHelper.DatabaseSmoke/Program.cs
          git commit -m "test: align shared extract filtering with map tab"
          git push origin HEAD:agent/v1.6.4-quest-active-minimap-markers
          git push origin --delete tmp-noop tmp-noop-2 agent/v164-minimap-controls-payload || true
