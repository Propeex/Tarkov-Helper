name: Apply FIR Fulfillment Hotfix

on:
  push:
    branches:
      - hotfix/fir-nonfir-fulfillment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/fir-nonfir-fulfillment

      - name: Apply verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .hotfix/fir-payload-*.b64 | base64 --decode > /tmp/fir-hotfix-payload.zip
          unzip -oq /tmp/fir-hotfix-payload.zip -d .

          grep -q '<Version>1.6.8</Version>' TarkovHelper/TarkovHelper.csproj
          grep -q 'ItemFulfillmentRegressionSmoke.Run();' TarkovHelper.DatabaseSmoke/Program.cs
          grep -q 'FIR requirements and total requirements must both be satisfied' TarkovHelper/Models/ItemInventory.cs

          rm -rf .hotfix
          rm .github/workflows/source-export.yml

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "FIR·일반 혼합 아이템 완료 판정 수정 v1.6.8"
          git push origin HEAD:hotfix/fir-nonfir-fulfillment
