name: Verify v1.8.2 Release

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Verify v1.8.2 source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Require-Text([string]$Path, [string]$Needle) {
            $content = Get-Content $Path -Raw
            if (-not $content.Contains($Needle)) {
              throw "Required source invariant is missing from $Path : $Needle"
            }
          }

          function Forbid-Text([string]$Path, [string]$Needle) {
            $content = Get-Content $Path -Raw
            if ($content.Contains($Needle)) {
              throw "Forbidden source invariant remains in $Path : $Needle"
            }
          }

          $availableRefs = @(git grep -n "QuestStatus.Available" -- "TarkovHelper/**/*.cs" 2>$null | Where-Object {
            $_ -notmatch 'TarkovHelper/Models/QuestStatus.cs'
          })
          if ($availableRefs.Count -gt 0) {
            $availableRefs | Write-Error
            throw "Legacy Available status is still referenced at runtime."
          }

          Forbid-Text "TarkovHelper/Pages/QuestListPage.xaml" "수주 가능"
          Forbid-Text "TarkovHelper/Pages/QuestListPage.xaml" 'Tag="Available"'
          Require-Text "TarkovHelper/Services/ActualQuestStatusEvaluator.cs" "return Cache(taskKey, QuestStatus.Active);"

          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"prapor",'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"fence",'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"btrdriver"'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"customs",'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"icebreaker",'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"terminal"'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"Weapons",'
          Require-Text "TarkovHelper/Services/UiSortOrder.cs" '"Special"'

          foreach ($category in @(
            '무기','탄창','탄약','의약품','음식','근접 무기','부품','수류탄',
            '물물교환','리그','고글','보관함','보호구','정보','열쇠','특수'
          )) {
            Require-Text "TarkovHelper/Services/LocalizationService.Items.cs" ('= "' + $category + '"')
          }

          Require-Text "TarkovHelper/Services/QuestRequirementInventoryKey.cs" 'range:{Normalize(questKey)}:{Normalize(groupKey)}'
          Require-Text "TarkovHelper/Services/QuestRequirementInventoryKey.cs" "BuildAlternativeItemKey(task, requirement, value)"
          Require-Text "TarkovHelper/Services/ItemsFilterService.cs" "Range requirements are displayed as multiple item rows"
          Require-Text "TarkovHelper/Services/ItemsFilterService.cs" "AlternativeGroupHeaderVisibility"

          Require-Text "TarkovHelper/Pages/AmmoPage.xaml" 'CanUserSortColumns="False"'
          Require-Text "TarkovHelper/Pages/AmmoPage.xaml" 'CanUserReorderColumns="False"'
          Require-Text "TarkovHelper/Pages/AmmoPage.xaml" 'RowBackground="{StaticResource BackgroundDarkBrush}"'
          Require-Text "TarkovHelper/Pages/AmmoPage.xaml" 'ColumnHeaderStyle="{StaticResource AmmoGridHeaderStyle}"'
          Require-Text "TarkovHelper/Pages/AmmoPage.xaml" 'Style="{StaticResource AmmoToolbarToggleStyle}"'
          Require-Text "TarkovHelper/Pages/AmmoPage.xaml.cs" ".OrderBy(item => item.ArmorEfficiencyScore)"
          Forbid-Text "TarkovHelper/Pages/AmmoPage.xaml.cs" ".ThenBy(item =>"
          Forbid-Text "TarkovHelper/Pages/AmmoPage.xaml.cs" "CaliberChoice(string Key, string DisplayName, int Count)"
          Forbid-Text "TarkovHelper/Pages/AmmoPage.xaml.cs" "({Count})"
          Require-Text "TarkovHelper/Services/Ammo/AmmoDbService.cs" '["Caliber40mmRU"] = "40mm 러시아 유탄"'
          Require-Text "TarkovHelper/Models/Ammo/AmmoItem.cs" "public string DisplayText => Effectiveness.ToString();"
          Require-Text "TarkovHelper/App.xaml.cs" "ComboBoxItem_RequestBringIntoView"
          Require-Text "TarkovHelper/App.xaml.cs" "e.Handled = true;"
          Require-Text "TarkovHelper/TarkovHelper.csproj" "<Version>1.8.2</Version>"
          Require-Text "TarkovHelper/TarkovHelper.csproj" "<FileVersion>1.8.2.0</FileVersion>"

          Write-Host "SOURCE_OK v1.8.2 source invariants verified"

      - name: Download and independently verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.8.2"
          $version = "1.8.2"
          $expectedTitle = "타르코프헬퍼_JH v$version"

          $release = gh release view $tag `
            --repo $env:GITHUB_REPOSITORY `
            --json name,tagName,isDraft,isPrerelease,url,publishedAt,targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $release) {
            throw "Published release could not be read."
          }
          if ($release.name -ne $expectedTitle -or $release.tagName -ne $tag) {
            throw "Release title or tag is invalid: name=$($release.name), tag=$($release.tagName)."
          }
          if ($release.isDraft -or $release.isPrerelease) {
            throw "v1.8.2 must be a public final release."
          }

          $assets = @($release.assets)
          foreach ($requiredAsset in @("TarkovHelper_JH.zip", "TarkovHelper_JH.zip.sha256")) {
            $asset = $assets | Where-Object { $_.name -eq $requiredAsset } | Select-Object -First 1
            if ($null -eq $asset -or [int64]$asset.size -le 0) {
              throw "Required release asset is missing or empty: $requiredAsset"
            }
          }

          New-Item -ItemType Directory -Path verification -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip" --dir verification
          if ($LASTEXITCODE -ne 0) { throw "Failed to download release ZIP." }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "TarkovHelper_JH.zip.sha256" --dir verification
          if ($LASTEXITCODE -ne 0) { throw "Failed to download release checksum." }

          $zipPath = "verification/TarkovHelper_JH.zip"
          $shaPath = "verification/TarkovHelper_JH.zip.sha256"
          $declaredHash = ((Get-Content $shaPath -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declaredHash -notmatch '^[0-9a-f]{64}$' -or $declaredHash -ne $actualHash) {
            throw "Published SHA-256 is invalid: declared=$declaredHash actual=$actualHash"
          }

          $env:ZIP_PATH = (Resolve-Path $zipPath).Path
          @'
          import os
          import pathlib
          import zipfile

          zip_path = os.environ['ZIP_PATH']
          forbidden_names = {
              'user_data.db', 'quest_progress.json', 'quest_progress_v2.json',
              'objective_progress.json', 'hideout_progress.json', 'item_inventory.json',
              'settings.json', 'app_settings.json'
          }
          forbidden_scanner_binaries = {'rateye.dll', 'ratstash.dll', 'tesseract.dll'}
          required_marker_icons = {
              'assets/db/icons/markers/boss.svg',
              'assets/db/icons/markers/cultist.svg',
              'assets/db/icons/markers/lever.svg',
              'assets/db/icons/markers/pmc spawn.svg',
              'assets/db/icons/markers/rogue.svg',
              'assets/db/icons/markers/sniperscav.svg',
          }

          with zipfile.ZipFile(zip_path) as archive:
              names = [name.replace('\\', '/') for name in archive.namelist()]
              lowered = [name.lower() for name in names]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate ZIP entries')
              if any(name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts for name in names):
                  raise SystemExit('unsafe ZIP path')

              files = {name for name in lowered if not name.endswith('/')}
              missing = sorted({'tarkovhelper_jh.exe', 'assets/tarkov_data.db'} - files)
              if missing:
                  raise SystemExit(f'missing required release files: {missing}')
              marker_missing = sorted(required_marker_icons - files)
              if marker_missing:
                  raise SystemExit(f'missing minimap marker icons: {marker_missing}')

              if any(pathlib.PurePosixPath(name).name in forbidden_names for name in lowered):
                  raise SystemExit('user progress or settings file included')
              if any(name.endswith('.pdb') for name in lowered):
                  raise SystemExit('debug symbol included')
              if any(name.startswith('assets/scanner/') for name in lowered):
                  raise SystemExit('removed scanner asset included')
              if any(name.startswith('thirdpartynotices/ratscanner-') for name in lowered):
                  raise SystemExit('removed RatScanner notice included')
              if any(pathlib.PurePosixPath(name).name in forbidden_scanner_binaries for name in lowered):
                  raise SystemExit('removed scanner runtime dependency included')

              item_icons = [name for name in lowered if name.startswith('assets/icons/') and name.endswith('.png')]
              if len(item_icons) < 100:
                  raise SystemExit(f'too few packaged item icons: {len(item_icons)}')
              empty_entries = [info.filename for info in archive.infolist() if not info.is_dir() and info.file_size == 0]
              if empty_entries:
                  raise SystemExit(f'empty packaged files: {empty_entries[:10]}')

              print(f'ZIP_OK entries={len(names)} item_icons={len(item_icons)}')
          '@ | python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Expand-Archive $zipPath -DestinationPath verification/extracted -Force
          $exePath = "verification/extracted/TarkovHelper_JH.exe"
          $databasePath = "verification/extracted/Assets/tarkov_data.db"
          $fileVersion = (Get-Item $exePath).VersionInfo.FileVersion
          if ($fileVersion -ne "$version.0") {
            throw "Published executable version is invalid: expected=$version.0 actual=$fileVersion"
          }
          if ((Get-Item $databasePath).Length -lt 1MB) {
            throw "Published database is unexpectedly small."
          }

          $env:DB_PATH = (Resolve-Path $databasePath).Path
          @'
          import json
          import os
          import sqlite3

          connection = sqlite3.connect(os.environ['DB_PATH'])
          connection.row_factory = sqlite3.Row

          def scalar(sql):
              return connection.execute(sql).fetchone()[0]

          if scalar('pragma integrity_check') != 'ok':
              raise SystemExit('database integrity_check failed')
          foreign_keys = connection.execute('pragma foreign_key_check').fetchall()
          if foreign_keys:
              raise SystemExit(f'foreign key violations: {len(foreign_keys)}')

          items = scalar('select count(*) from Items')
          quests = scalar('select count(*) from Quests')
          ammo = scalar('select count(*) from Ammo')
          calibers = scalar('select count(distinct Caliber) from Ammo')
          linked_ammo = scalar('select count(*) from Ammo a join Items i on i.Id = a.ItemId')
          korean_ammo = scalar("select count(*) from Ammo a join Items i on i.Id = a.ItemId where trim(coalesce(i.NameKO, '')) != ''")
          sources = scalar("select count(*) from Ammo where trim(coalesce(AcquisitionSource, '')) != '' and AcquisitionSource not in ('raid/other', '레이드 획득/기타')")
          missing_prerequisites = scalar('''
              select count(*) from QuestRequirements r
              left join Quests source on source.Id = r.QuestId
              left join Quests required on required.Id = r.RequiredQuestId
              where source.Id is null or required.Id is null
          ''')
          invalid_concrete = scalar('''
              select count(*) from QuestRequiredItems r
              left join Items i on i.Id = r.ItemId
              where r.IsAlternativeGroup = 0 and (r.ItemId is null or i.Id is null)
          ''')
          malformed_groups = scalar('''
              select count(*) from QuestRequiredItems
              where IsAlternativeGroup = 1 and (
                  ItemId is not null or coalesce(RequirementGroupId, '') = ''
                  or json_valid(AlternativeItemIds) != 1 or json_array_length(AlternativeItemIds) < 2
                  or json_valid(AlternativeItemNames) != 1
                  or json_array_length(AlternativeItemNames) != json_array_length(AlternativeItemIds)
              )
          ''')
          unresolved_groups = scalar('''
              select count(*) from QuestRequiredItems r, json_each(r.AlternativeItemIds) alternative
              left join Items i on i.Id = alternative.value
              where r.IsAlternativeGroup = 1 and i.Id is null
          ''')
          groups = scalar('select count(*) from QuestRequiredItems where IsAlternativeGroup = 1')
          helping_level = scalar("select coalesce(max(MinLevel), -1) from Quests where Name = 'A Helping Hand'")
          helping_prerequisites = scalar('''
              select count(*) from QuestRequirements r
              join Quests source on source.Id = r.QuestId
              join Quests required on required.Id = r.RequiredQuestId
              where source.Name = 'A Helping Hand' and required.Name = 'Saving the Mole'
          ''')

          if items < 1000 or quests < 300:
              raise SystemExit(f'implausible core counts: items={items} quests={quests}')
          if ammo < 150 or linked_ammo != ammo or korean_ammo != ammo or calibers < 20 or sources < 20:
              raise SystemExit(f'ammo validation failed: ammo={ammo} linked={linked_ammo} korean={korean_ammo} calibers={calibers} sources={sources}')
          if missing_prerequisites or invalid_concrete or malformed_groups or unresolved_groups or groups < 1:
              raise SystemExit(f'quest requirement validation failed: prerequisites={missing_prerequisites} concrete={invalid_concrete} malformed={malformed_groups} unresolved={unresolved_groups} groups={groups}')
          if helping_level != 20 or helping_prerequisites != 1:
              raise SystemExit(f'A Helping Hand conditions invalid: level={helping_level} prerequisites={helping_prerequisites}')

          result = {
              'items': items,
              'quests': quests,
              'ammo': ammo,
              'calibers': calibers,
              'sources': sources,
              'alternative_groups': groups,
              'helping_hand_level': helping_level,
              'helping_hand_prerequisites': helping_prerequisites,
          }
          print('DB_OK ' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          with open('verification-database-result.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2, sort_keys=True)
          connection.close()
          '@ | python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @(
            "RELEASE=$($release.url)",
            "TAG=$tag",
            "VERSION=$fileVersion",
            "SHA256=$actualHash",
            "PUBLISHED_AT=$($release.publishedAt)"
          ) | Set-Content verification-result.txt -Encoding utf8

      - name: Upload independent verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: v1.8.2-release-verification
          path: |
            verification-result.txt
            verification-database-result.json
          if-no-files-found: error
