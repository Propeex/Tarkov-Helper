name: Quest Catalog Release Notes Maintenance

on:
  pull_request:
    types: [reopened]

jobs:
  apply:
    if: github.event.pull_request.number == 34 && github.head_ref == 'agent/quest-catalog-sync-fix'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Update v1.10.1 release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          ### v1.8.4 수정
          - 미니맵을 켠 상태에서 퀘스트·은신처·아이템·총알·스캐너 탭으로 이동해도 미니맵 창과 추적 기능이 유지되도록 수정
          - 일반 탭 전환과 프로필 전환·앱 종료를 구분하여 페이지 교체와 종료 시에는 기존 자원 정리를 유지
          - 반복적인 지도 탭 진입과 이탈에서도 미니맵 이벤트 구독이 중복되지 않도록 정규화
'''
          new = '''          ### v1.10.1 수정
          - tarkov.dev 기본 퀘스트 데이터에 공개 보정 데이터를 함께 적용해 실제 PVP 퀘스트 목록과의 불일치를 수정
          - 누락됐던 Ragman `New Beginning` Prestige 5/6 퀘스트를 복구하고 Prestige 요구 레벨을 정확히 반영
          - 잘못된 영문 퀘스트명 `Neuanfang`을 `New Beginning`으로 보정
          - 보정 데이터의 추가/비활성/로케일/Prestige 정보를 DB 재구축 시 함께 반영
          - 보정 데이터를 검증할 수 없으면 기존 DB를 유지하도록 fail-closed 처리
'''
          if text.count(old) != 1:
              raise SystemExit(f'release note marker count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git diff --cached --check
          git commit -m "Update 1.10.1 release notes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
