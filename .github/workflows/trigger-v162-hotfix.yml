name: Trigger v1.6.2 Hotfix Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'hotfix/v1.6.2-reset-quest-tab-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.6.2-reset-quest-tab-freeze
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-v162-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit patched source"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          Path('/tmp/apply_v162.py').write_text(script, encoding='utf-8')
          subprocess.run(['python3', '/tmp/apply_v162.py'], check=True)
          PY

      - name: Commit patched source
        shell: bash
        run: |
          rm -f .github/workflows/trigger-v162-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.6.2 실사용 회귀 수정 적용"
          git push origin HEAD:hotfix/v1.6.2-reset-quest-tab-freeze
