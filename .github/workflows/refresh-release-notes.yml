name: Refresh Release Notes

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed

permissions:
  contents: write

jobs:
  refresh-notes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "TarkovHelper/TarkovHelper.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version could not be read."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update v1.6.7 release notes
        if: steps.version.outputs.version == '1.6.7'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @'
          ## 타르코프헬퍼_JH VERSION_PLACEHOLDER

          Escape from Tarkov PVP 진행도, 아이템, 은신처 및 지도 정보를 관리하는 Windows용 도우미입니다.

          ### v1.6.7 수정
          - 퀘스트 탭 지도 분류에서 조건별 변형 맵 키를 기본 맵으로 통합
          - `ground-zero-21` 등 Ground Zero 레벨 변형을 `Ground Zero` 하나로 표시
          - `night-factory` 등 Factory 주·야간 변형을 `Factory` 하나로 표시
          - 변형 맵에 연결된 퀘스트도 기본 맵 필터에서 함께 조회되도록 개선
          - 기존에 선택한 변형 지도 필터를 기본 맵 선택으로 자동 승계

          ### 설치
          1. TarkovHelper_JH.zip을 원하는 폴더에 압축 해제합니다.
          2. TarkovHelper_JH.exe를 실행합니다.
          3. .NET 8 Windows Desktop Runtime이 필요합니다.

          기존 user_data.db는 릴리즈 ZIP에 포함되지 않으며 업데이트 시 유지됩니다.
          '@.Replace("VERSION_PLACEHOLDER", $version)
          $notes | Set-Content RELEASE_NOTES.md -Encoding utf8

          gh release edit "v$version" `
            --repo $env:GITHUB_REPOSITORY `
            --notes-file RELEASE_NOTES.md
