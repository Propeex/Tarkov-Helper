name: Refresh Release Notes

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed

permissions:
  contents: write

jobs:
  refresh-notes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "TarkovHelper/TarkovHelper.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Project version could not be read."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Update v1.6.8 release notes
        if: steps.version.outputs.version == '1.6.8'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $notes = @'
          ## 타르코프헬퍼_JH VERSION_PLACEHOLDER

          Escape from Tarkov PVP 진행도, 아이템, 은신처 및 지도 정보를 관리하는 Windows용 도우미입니다.

          ### v1.6.8 수정
          - 같은 아이템에 FIR 요구량과 일반 요구량이 함께 있을 때 FIR 수량만 충족해도 전체 완료로 판정되던 문제 수정
          - FIR 최소 수량과 전체 최소 수량을 모두 충족해야 수집 완료로 처리하도록 변경
          - FIR 아이템을 FIR 요구 구간에 먼저 반영하고, 남는 FIR만 일반 요구 구간에 반영하도록 진행률 계산 수정
          - 필요 아이템, 퀘스트·은신처 요구사항, 수집가 및 통합 요구사항 화면의 완료 판정을 동일한 규칙으로 통일
          - FIR 5개·전체 15개 요구 사례를 포함한 자동 회귀 검사 추가

          ### 설치
          1. TarkovHelper_JH.zip을 원하는 폴더에 압축 해제합니다.
          2. TarkovHelper_JH.exe를 실행합니다.
          3. .NET 8 Windows Desktop Runtime이 필요합니다.

          기존 user_data.db는 릴리즈 ZIP에 포함되지 않으며 업데이트 시 유지됩니다.
          '@.Replace("VERSION_PLACEHOLDER", $version)
          $notes | Set-Content RELEASE_NOTES.md -Encoding utf8

          gh release edit "v$version" `
            --repo $env:GITHUB_REPOSITORY `
            --notes-file RELEASE_NOTES.md
