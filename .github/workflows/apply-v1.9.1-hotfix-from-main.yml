name: Apply v1.9.1 hotfix to review branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/content-recovery-1.9.1
          fetch-depth: 0

      - name: Apply committed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/v1.9.1-content-recovery.patch > /tmp/v1.9.1-content-recovery.patch
          echo "Patch SHA-256: $(sha256sum /tmp/v1.9.1-content-recovery.patch | awk '{print $1}')"
          git apply --check --whitespace=error-all /tmp/v1.9.1-content-recovery.patch
          git apply --index --whitespace=error-all /tmp/v1.9.1-content-recovery.patch
          rm -f .github/workflows/apply-content-recovery-hotfix.yml
          git add -A
          git diff --cached --check

          grep -Fq '<Version>1.9.1</Version>' TarkovHelper/TarkovHelper.csproj
          grep -Fq '<version>1.9.1</version>' update.xml
          grep -Fq 'RecoverCurrentFromPreviousOrBundled();' TarkovHelper/Services/ContentStorageService.cs
          grep -Fq 'VerifyInterruptedCommitRecovery(storage, rebuiltHash);' TarkovHelper.DatabaseSmoke/ContentStorageRegressionSmoke.cs

      - name: Commit hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix interrupted content recovery for v1.9.1"
          git push origin HEAD:hotfix/content-recovery-1.9.1

      - name: Remove successful one-time files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm \
            .github/workflows/apply-v1.9.1-hotfix-from-main.yml \
            .github/v1.9.1-content-recovery.patch
          git commit -m "Remove v1.9.1 hotfix application files"
          git push origin HEAD:main
