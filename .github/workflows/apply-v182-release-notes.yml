name: Apply v1.8.2 release notes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/quest-item-ammo-ui-1.8.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quest-item-ammo-ui-1.8.2
          fetch-depth: 0

      - name: Update release notes
        run: |
          set -euo pipefail
          python .github/v182-release/patch.py
          git rm -f .github/v182-release/patch.py .github/workflows/apply-v182-release-notes.yml
          rmdir .github/v182-release 2>/dev/null || true

      - name: Commit release notes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update v1.8.2 release notes"
          git push origin HEAD:agent/quest-item-ammo-ui-1.8.2
